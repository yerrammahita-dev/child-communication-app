<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Minds — Read, Create, Communicate</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#15222e;--muted:#546875;--white:#fff;--line:#cde0ed;--shadow:0 8px 30px rgba(27,62,88,0.12)}
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden;min-height:100vh;transition:background-color 0.4s ease}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #1976d2;outline-offset:3px}

body.bg-home{background-color:#ffffff}
body.bg-books{background-color:#fffef0}
body.bg-draw{background-color:#f0fff0}
body.bg-math{background-color:#f0f8ff}
body.bg-tracing{background-color:#faf5ff}
body.bg-sentence{background-color:#fff5f5}
body.bg-vocab{background-color:#fff0f5}
body.bg-settings{background-color:#f8fafc}

#bgCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;transition:opacity 0.4s ease}

.shell{position:relative;z-index:1;max-width:1180px;margin:auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px;color:#133c55}
.brand span{color:#1976d2}
.nav{display:flex;gap:7px;flex-wrap:wrap}
.nav button,.btn{border:1px solid var(--line);background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:650}
.nav button.active,.btn.primary{background:#1976d2;color:white;border-color:#1976d2}
.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
main{min-height:65vh}

.hero{position:relative;background:rgba(255,255,255,0.94);backdrop-filter:blur(14px);border:1px solid rgba(205,224,237,0.8);border-radius:24px;padding:clamp(28px,6vw,50px);margin-bottom:24px;box-shadow:0 12px 32px rgba(27,62,88,0.12)}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.08;max-width:720px;margin:0 0 16px;letter-spacing:-1.5px;color:#133c55}
.hero p{font-size:19px;color:#43617b;max-width:640px;margin:0 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.home-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.home-card .icon{font-size:28px;color:#1976d2}
.home-card h2{font-size:20px;margin:8px 0 2px;color:#133c55}
.home-card p,.muted{color:var(--muted);margin:0}

.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}
.section-head h1{margin:0;font-size:34px;letter-spacing:-1px;color:#133c55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input,select,textarea{border:1px solid #bcd4e6;border-radius:10px;padding:11px 12px;background:rgba(255,255,255,0.95);color:var(--ink)}
.input{min-width:190px}

.book-card{position:relative;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s ease;transform-origin:center center;display:flex;flex-direction:column;justify-content:space-between}
.book-card:hover{transform:scale(1.05) translateY(-6px);box-shadow:0 22px 36px rgba(27,62,88,0.2);z-index:10}
.book-cover-img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.book-badge-bar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
.badge-btn{background:rgba(255,255,255,0.95);backdrop-filter:blur(4px);border:1px solid #d0e1ed;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:16px;cursor:pointer;transition:all 0.2s}
.badge-btn.star-btn.active{background:#fff8d6;border-color:#ffd700;color:#ffb700}
.badge-btn.heart-btn.active{background:#ffebee;border-color:#ff1744;color:#ff1744}

.reader{max-width:760px;margin:20px auto;background:rgba(255,255,255,0.98);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,5vw,45px);text-align:center;box-shadow:var(--shadow)}
.reader .page-img{width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin-bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
.reader .page-text{font-size:clamp(18px,2.8vw,24px);line-height:1.6;min-height:140px;display:grid;place-items:center;text-align:left;padding:0 10px}
.reader-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}

.board-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
.categories{display:grid;gap:8px;align-content:start}
.categories button{text-align:left}
.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.word{min-height:76px;background:rgba(235,245,252,0.92);border:1px solid var(--line);border-radius:14px;font-size:20px;font-weight:700;color:#133c55}
.word:hover{background:#cfe3f3}
.sentence{min-height:70px;font-size:24px;padding:14px;background:rgba(240,248,255,0.92);border:1px dashed #9bc1d9;border-radius:14px;margin:12px 0}

.canvas-wrap{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;box-shadow:var(--shadow)}
.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);touch-action:none;cursor:crosshair}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.color{width:28px;height:28px;border:2px solid white;box-shadow:0 0 0 1px #9bc1d9;border-radius:50%;padding:0}
.color.selected{box-shadow:0 0 0 3px #1976d2}

.stencil-card{position:relative;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stencil-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.stencil-display{font-size:42px;font-weight:800;color:#133c55;margin:8px 0;line-height:1}
.custom-badge{position:absolute;top:10px;right:10px;width:10px;height:10px;background:#2e7d32;border-radius:50%}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:20px}
.modal-content{background:white;border-radius:24px;max-width:920px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.25);position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:#eef6fc;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}

.notice{background:#fff8d6;border-radius:12px;padding:12px 14px;color:#6b5b19}
.list{display:grid;gap:9px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}
.small{font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:700px){.shell{padding:13px}.top{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.nav button{padding:9px 5px;font-size:14px}.board-layout{grid-template-columns:1fr}.categories{display:flex;overflow:auto}.categories button{white-space:nowrap}.hero{padding:20px 0}.section-head h1{font-size:29px}}
</style>
</head>
<body class="bg-home">

<canvas id="bgCanvas"></canvas>

<div class="shell">
<header class="top">
  <div class="brand"><i class="fa-solid fa-seedling text-blue-600 mr-1.5"></i>little <span>minds</span></div>
  <nav class="nav" aria-label="Main navigation" id="nav"></nav>
</header>
<main id="app"></main>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-content" id="modalBody"></div>
</div>

<script>
const STORE={vocab:"lm-vocab-v1",sentences:"lm-sentences-v1",history:"lm-history-v1",drawings:"lm-drawings-v1",favs:"lm-favs-v1",math:"lm-math-v6",customStencils:"lm-stencils-v5",savedColors:"lm-saved-colors-v3"};
const initialVocab={
 People:["I","you","mom","dad","teacher","friend","grandma","grandpa","sister","brother","they","we","baby","family"],
 Feelings:["happy","sad","tired","excited","calm","worried","silly","angry","scared","proud","loved","curious"],
 Actions:["want","like","need","go","stop","play","read","draw","eat","drink","help","look","make","rest","run","jump"],
 Places:["home","school","park","outside","bedroom","bathroom","kitchen","library","store","beach","zoo"],
 Objects:["book","ball","juice","toy","blanket","pencil","paper","tablet","music","snack","block","crayon"],
 Helpers:["please","thank you","help","yes","no","more","all done","again","my turn","your turn","excuse me"],
 Needs:["break","water","food","toilet","quiet","hug","medicine","different","wait","restroom"],
 Food:["apple","banana","bread","pasta","rice","milk","water","cracker","cheese","strawberry","pizza","cookie"],
 Questions:["what","where","who","when","why","how","can I","do you","may I"],
 Social:["hello","goodbye","excuse me","I love you","good morning","good night","nice to meet you"],
 Sensory:["too loud","too bright","soft","cold","hot","itchy","comfortable","quiet","heavy","light"]
};

let vocab=JSON.parse(localStorage.getItem(STORE.vocab))||initialVocab,
    saved=JSON.parse(localStorage.getItem(STORE.sentences))||[],
    history=JSON.parse(localStorage.getItem(STORE.history))||[],
    drawings=JSON.parse(localStorage.getItem(STORE.drawings))||[],
    userFavs=JSON.parse(localStorage.getItem(STORE.favs))||{stars:{},hearts:{}},
    customStencils=JSON.parse(localStorage.getItem(STORE.customStencils))||[],
    savedColors=JSON.parse(localStorage.getItem(STORE.savedColors))||["#ff1744","#ff9100","#ffea00","#00e676","#00b0ff"];

function persist(){
  localStorage.setItem(STORE.vocab,JSON.stringify(vocab));
  localStorage.setItem(STORE.sentences,JSON.stringify(saved));
  localStorage.setItem(STORE.history,JSON.stringify(history));
  localStorage.setItem(STORE.drawings,JSON.stringify(drawings));
  localStorage.setItem(STORE.favs,JSON.stringify(userFavs));
  localStorage.setItem(STORE.customStencils,JSON.stringify(customStencils));
  localStorage.setItem(STORE.savedColors,JSON.stringify(savedColors));
}

// 72 Vibrant colors starting with vibrant reds/oranges/yellows
const vibrantPalette72 = [
  "#ff1744","#ff3d00","#ff6d00","#ff9100","#ffab00","#ffd600","#ffea00","#aeea00",
  "#64dd17","#00e676","#1de9b6","#00b0ff","#2979ff","#651fff","#aa00ff","#ff00ff",
  "#f50057","#d50000","#ff5252","#ff8a80","#3e2723","#4e342e","#5d4037","#795548",
  "#8d6e63","#a1887f","#bcaaa4","#d7ccc8","#efebe9","#212121","#424242","#616161",
  "#757575","#9e9e9e","#bdbdbd","#e0e0e0","#eeeeee","#ffffff","#ff80ab","#ff4081",
  "#c51162","#ea80fc","#e040fb","#d500f9","#b388ff","#7c4dff","#6200ea","#8c9eff",
  "#536dfe","#304ffe","#80d8ff","#0091ea","#00e5ff","#00bfa5","#69f0ae","#00c853",
  "#b9f6ca","#ccff90","#eeff41","#ffff00","#ffd740","#ffab40","#dd2c00","#b71c1c",
  "#880e4f","#4a148c","#311b92","#1a237e","#0d47a1","#006064","#004d40","#1b5e20"
];

const classicBooksData = [];
const bookThemes = [
  {t:"The Three Little Pigs", a:"Traditional Folk Tale", s:"Three little pigs build houses to outsmart a clever wolf."},
  {t:"Little Red Riding Hood", a:"Brothers Grimm", s:"A brave girl travels through the forest to visit her grandmother."},
  {t:"Goldilocks and the Three Bears", a:"Fairy Tale", s:"A curious visitor discovers a woodland cottage belonging to three bears."},
  {t:"Pinocchio", a:"Carlo Collodi", s:"A wooden puppet goes on a magical journey to learn honesty and friendship."},
  {t:"Peter Pan", a:"J.M. Barrie", s:"A timeless adventure to Neverland where children fly and imagination rules."},
  {t:"The Ugly Duckling", a:"H.C. Andersen", s:"A heartwarming story about finding where you truly belong."},
  {t:"Hansel and Gretel", a:"Brothers Grimm", s:"Two clever siblings navigate a woodland journey using teamwork."},
  {t:"Cinderella", a:"Charles Perrault", s:"A classic tale of kindness, magic, and believing in your dreams."},
  {t:"Alice in Wonderland", a:"Lewis Carroll", s:"A whimsical journey down a rabbit hole into a magical realm."},
  {t:"The Velveteen Rabbit", a:"Margery Williams", s:"A beloved toy learns how real love transforms everything."},
  {t:"Winnie-the-Pooh", a:"A.A. Milne", s:"Gentle woodland adventures with a honey-loving bear and friends."},
  {t:"The Tale of Peter Rabbit", a:"Beatrix Potter", s:"A mischievous rabbit adventures into Mr. McGregor's garden."},
  {t:"Jack and the Beanstalk", a:"Traditional", s:"A brave boy climbs a magical beanstalk into a giant's castle."},
  {t:"The Wizard of Oz", a:"L. Frank Baum", s:"Dorothy and friends travel the yellow brick road to the Emerald City."},
  {t:"The Jungle Book", a:"Rudyard Kipling", s:"Adventures of a boy raised by wolves in the vibrant jungle."}
];

for(let i=1; i<=300; i++){
  let base = bookThemes[(i-1) % bookThemes.length];
  let title = i <= 15 ? base.t : `${base.t} (Book ${i})`;
  let summary = base.s;
  let cover = `https://images.unsplash.com/photo-${1500000000000 + (i * 123456) % 999999}?w=600&auto=format&fit=crop&q=60`;
  classicBooksData.push({
    title, author: base.a, summary, cover,
    pages: [
      `Once upon a time in ${title}, an extraordinary journey began under the warm sun.`,
      `New friends and exciting discoveries waited around every corner of the path.`,
      `With courage and kindness, every challenge was successfully met with a smile.`,
      `The day concluded with wonderful memories and excitement for tomorrow.`
    ]
  });
}

const books = classicBooksData.map(b => ({
  title: b.title, author: b.author, summary: b.summary, image: b.cover,
  pages: b.pages.map(t => ({ img: b.cover, text: t }))
}));

const mathGradeSubjects = [
  "Kindergarten", "1st Grade", "2nd Grade", "3rd Grade", "4th Grade", "5th Grade",
  "6th Grade", "7th Grade", "8th Grade", "9th Grade", "10th Grade", "Trigonometry", "Advanced Functions"
];

const topicNames = [
  "Counting Objects", "Shapes Recognition", "Sides of Shapes", "Simple Addition", 
  "Subtraction Basics", "Number Patterns", "Measurement & Size", "Word Problems", 
  "Data & Graphs", "Advanced Mastery"
];

const mathCategories = mathGradeSubjects.map((subject, sIdx) => {
  if(subject === "Kindergarten"){
    return { id: `math-sub-${sIdx}`, name: "Kindergarten Mathematics", category: subject, parts: kindergartenParts };
  }
  const parts = [];
  for(let p = 1; p <= 10; p++){
    const questions = [];
    const topic = topicNames[p - 1];
    for(let q = 1; q <= 10; q++){
      let qText = "";
      let ans = "";
      let opts = [];
      if(subject === "Trigonometry"){
        const trigQList = [
          { q: "What is the sine of 90 degrees (or pi/2 radians)?", ans: "1", opts: ["1", "0", "-1", "0.5"] },
          { q: "What is the cosine of 0 degrees?", ans: "1", opts: ["1", "0", "-1", "0.5"] },
          { q: "What is the tangent of 45 degrees?", ans: "1", opts: ["1", "0", "sqrt(3)", "undefined"] },
          { q: "In a right triangle, what is the ratio of the opposite side to the hypotenuse?", ans: "Sine", opts: ["Sine", "Cosine", "Tangent", "Secant"] },
          { q: "What is the reciprocal of Sine?", ans: "Cosecant", opts: ["Cosecant", "Secant", "Cotangent", "Cosine"] },
          { q: "What is cos(pi) in radians?", ans: "-1", opts: ["-1", "1", "0", "0.5"] },
          { q: "What is the period of the standard sine function y = sin(x)?", ans: "2*pi", opts: ["2*pi", "pi", "pi/2", "4*pi"] },
          { q: "What is tan(90 degrees)?", ans: "Undefined", opts: ["Undefined", "0", "1", "-1"] },
          { q: "What identity relates sin^2(x) + cos^2(x)?", ans: "1", opts: ["1", "0", "2", "sin(2x)"] },
          { q: "What is sec(0)?", ans: "1", opts: ["1", "0", "infinite", "-1"] }
        ];
        let item = trigQList[(q - 1) % trigQList.length];
        qText = `Trigonometry (${topic} Q${q}): ${item.q}`;
        ans = item.ans;
        opts = [...item.opts];
      } else {
        let val = (sIdx + 1) * p + q;
        qText = `${subject} — ${topic} (Q${q}): Evaluate expression ${val} + ${q} * 2`;
        ans = `${val + q * 2}`;
        opts = [`${val + q * 2}`, `${val + q + 5}`, `${Math.max(0, val - q)}`, `${val + 10}`];
      }
      opts.sort(() => Math.random() - 0.5);
      questions.push({ q: qText, options: opts, answer: ans });
    }
    parts.push({ partNum: p, topic, questions });
  }
  return { id: `math-sub-${sIdx}`, name: `${subject} Mathematics`, category: subject, parts };
});

function openStencilModal(stencilText, customBgImg = null){
  const modal = document.querySelector("#modalOverlay");
  const modalBody = document.querySelector("#modalBody");
  modalBody.innerHTML = `
    <button class="modal-close" id="closeModal">✕</button>
    <h2>Tracing Studio: ${escapeHtml(stencilText)}</h2>
    <p class="muted small" style="margin-bottom:12px">Trace over the guide on the canvas below!</p>
    <div class="canvas-wrap" style="position:relative">
      <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;user-select:none;overflow:hidden">
        ${customBgImg ? `<img src="${customBgImg}" style="width:100%;height:100%;object-fit:contain;opacity:0.25">` : `<div style="font-size:120px;font-weight:900;color:rgba(25,118,210,0.12)">${escapeHtml(stencilText)}</div>`}
      </div>
      <canvas id="stencilCanvas" aria-label="Tracing canvas"></canvas>
    </div>
    <div class="toolbar" style="margin-top:16px">
      <button class="btn" id="clearStencilCanvas"><i class="fa-solid fa-trash mr-1"></i> Clear</button>
    </div>
  `;
  modal.classList.remove("hidden");
  document.querySelector("#closeModal").onclick = () => modal.classList.add("hidden");

  const sc = document.getElementById("stencilCanvas");
  const sctx = sc.getContext("2d");
  let drawing = false, start = null;

  function resizeStencil(){
    let r = sc.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    sc.width = r.width * dpr; sc.height = r.height * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.fillStyle = "white"; sctx.fillRect(0, 0, r.width, r.height);
  }
  setTimeout(resizeStencil, 50);

  function pos(e){ let r = sc.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function down(e){ e.preventDefault(); sc.setPointerCapture(e.pointerId); drawing = true; start = pos(e); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    let p = pos(e);
    sctx.beginPath();
    sctx.strokeStyle = "#1976d2";
    sctx.lineWidth = 10;
    sctx.lineCap = "round";
    sctx.moveTo(start.x, start.y);
    sctx.lineTo(p.x, p.y);
    sctx.stroke();
    start = p;
  }
  function up(e){ drawing = false; try{ sc.releasePointerCapture(e.pointerId); }catch(err){} }

  sc.addEventListener("pointerdown", down);
  sc.addEventListener("pointermove", move);
  sc.addEventListener("pointerup", up);

  document.getElementById("clearStencilCanvas").onclick = () => {
    sctx.fillStyle = "white";
    sctx.fillRect(0, 0, sc.width, sc.height);
  };
}

function setupCanvas(){
  const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");
  let drawing=false,start=null,undo=[];
  
  function resize(){
    let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,old=document.createElement("canvas");
    old.width=canvas.width;old.height=canvas.height;
    if(old.width)old.getContext("2d").drawImage(canvas,0,0);
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);
    if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  }
  resize();window.addEventListener("resize",resize);

  document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{
    activeColor=b.dataset.color;
    document.querySelector("#nativeColorPicker").value = activeColor;
    document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b));
  });

  document.querySelector("#nativeColorPicker").oninput=(e)=>{ activeColor = e.target.value; };

  document.querySelector("#saveCurrentColorBtn").onclick = () => {
    if(!savedColors.includes(activeColor)){
      savedColors.push(activeColor);
      persist();
      const countEl = document.querySelector("#savedCount");
      if(countEl) countEl.textContent = savedColors.length;
      alert(`Color ${activeColor} saved to Saved Colors!`);
    } else {
      alert("This color is already in your Saved Colors.");
    }
  };

  document.querySelector("#moreColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Expanded Color Palette (72 Vibrant Colors)</h2>
      <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
        ${vibrantPalette72.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-col="${c}"></button>`).join("")}
      </div>
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-col]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickCol;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#savedColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Saved Colors</h2>
      ${savedColors.length === 0 ? '<p class="empty">No saved colors yet. Click "Save Color" in the studio.</p>' : `
        <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
          ${savedColors.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-saved="${c}"></button>`).join("")}
        </div>
      `}
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-saved]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickSaved;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#brush").onchange=(e)=>{ activeBrush = e.target.value; };

  function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function down(e){
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drawing=true;
    start=pos(e);
    undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));

    if(activeBrush === "Stamp"){
      drawStamp(start.x, start.y);
    }
  }
  
  function drawStamp(x, y) {
    ctx.save();
    ctx.fillStyle = activeColor;
    ctx.font = "28px sans-serif";
    const symbols = ["⭐", "❤️", "🌸", "☀️", "🍀", "🎨"];
    const sym = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(sym, x - 12, y + 10);
    ctx.restore();
  }

  function move(e){
    if(!drawing)return;
    e.preventDefault();
    let p=pos(e);
    const brush = activeBrush;
    const sz = +document.querySelector("#size").value;

    if (brush === "Stamp") {
      if(Math.hypot(p.x - start.x, p.y - start.y) > 25) {
        drawStamp(p.x, p.y);
        start = p;
      }
      return;
    }

    if (brush === "Wispy Paintbrush") {
      for (let i = -sz/2; i <= sz/2; i += 3) {
        ctx.beginPath();
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.35;
        ctx.moveTo(start.x + i, start.y + (Math.random()*4-2));
        ctx.lineTo(p.x + i, p.y + (Math.random()*4-2));
        ctx.stroke();
      }
    } else if (brush === "Watercolor") {
      // Straight, translucent, soft-edged wet line
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 2.5;
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.22;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Crayon") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.4;
      ctx.lineCap = "butt";
      ctx.globalAlpha = 0.65;
      for(let d=0; d<5; d++) {
        let ox = (Math.random()-0.5)*sz*0.8;
        let oy = (Math.random()-0.5)*sz*0.8;
        ctx.moveTo(start.x+ox, start.y+oy);
        ctx.lineTo(p.x+ox, p.y+oy);
      }
      ctx.stroke();
    } else if (brush === "Pencil") {
      // Straight line with messy graphite dust dots
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = Math.max(1, sz * 0.35);
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.85;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.fillStyle = activeColor;
      for(let k=0; k<3; k++){
        let dx = p.x + (Math.random()-0.5)*sz*1.5;
        let dy = p.y + (Math.random()-0.5)*sz*1.5;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(dx, dy, 1.2, 1.2);
      }
    } else if (brush === "Marker") {
      // Thick, strong, solid bold ink line
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "square";
      ctx.globalAlpha = 0.95;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Eraser") {
      ctx.beginPath();
      ctx.strokeStyle = "white";
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "round";
      ctx.globalAlpha = 1.0;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    start=p;
  }
  
  function up(e){
    if(drawing) {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    }
    drawing=false;
    ctx.globalAlpha=1;
  }
  
  canvas.addEventListener("pointerdown",down);
  canvas.addEventListener("pointermove",move);
  canvas.addEventListener("pointerup",up);
  canvas.addEventListener("pointercancel",up);

  document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};
  document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};
  document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("Remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};
  document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()});
}

(function initWordBg(){
  const canvas = document.getElementById("bgCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width, height;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const backgroundWords = [
    "Read", "Create", "Communicate", "Joy", "Story", "Paint", "Spark", "Voice", "Dream", "Imagine",
    "Friend", "Listen", "Play", "Smile", "Happy", "Together", "Colors", "Books", "Words", "Feelings",
    "Kindness", "Hope", "Explore", "Write", "Draw", "Share", "Peace", "Quiet", "Magic", "Journey",
    "Love", "Help", "Want", "Need", "Calm", "Brave", "Brilliant", "Shine", "Grow", "Connect", "Learn", "Mind"
  ];

  const vibrantColors = [
    [255, 23, 68], [255, 145, 0], [255, 234, 0], [0, 230, 118], [0, 176, 255], [224, 64, 251]
  ];

  const wordParticles = [];
  for (let i = 0; i < 45; i++) {
    const col = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];
    wordParticles.push({
      text: backgroundWords[Math.floor(Math.random() * backgroundWords.length)],
      x: Math.random() * width,
      y: Math.random() * height,
      fontSize: 14 + Math.floor(Math.random() * 14),
      color: col,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      alpha: 0.25 + Math.random() * 0.35
    });
  }

  function animate(){
    ctx.clearRect(0, 0, width, height);
    wordParticles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -100) p.x = width + 100;
      if (p.x > width + 100) p.x = -100;
      if (p.y < -60) p.y = height + 60;
      if (p.y > height + 60) p.y = -60;

      ctx.font = `600 ${p.fontSize}px system-ui, sans-serif`;
      ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha})`;
      ctx.fillText(p.text, p.x, p.y);
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

render();
</script>
