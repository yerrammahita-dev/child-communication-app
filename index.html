<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Ways — Read, Create, Communicate</title>
<style>
:root{--ink:#24333b;--muted:#68777c;--paper:#fbfaf7;--white:#fff;--line:#e4e8e5;--green:#376c5c;--mint:#e8f2ed;--coral:#f4e3dc;--blue:#e5eef3;--yellow:#f5efd9;--shadow:0 8px 26px #263b3210}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e4a44b;outline-offset:3px}

/* Full-screen animated wave canvas */
#waveCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;opacity:0.95;transition:opacity 0.4s ease}
#waveCanvas.off{opacity:0!important}

.shell{position:relative;z-index:1;max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--green)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:650}.nav button.active,.btn.primary{background:var(--green);color:white;border-color:var(--green)}.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}main{min-height:65vh}.hero{position:relative;padding:clamp(28px,6vw,50px) 0;margin-bottom:24px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.04;max-width:650px;margin:0 0 16px;letter-spacing:-2px}.hero p{font-size:19px;color:#52645d;max-width:590px}.hero-content{position:relative;z-index:1}.hero .btn{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.home-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.home-card .icon{font-size:28px}.home-card h2{font-size:20px;margin:8px 0 2px}.home-card p,.muted{color:var(--muted);margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}.section-head h1{margin:0;font-size:34px;letter-spacing:-1px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,select,textarea{border:1px solid #d9e0dc;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}.input{min-width:190px}

/* 3D Bulging Hover Effect for Books */
.book-card{transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s ease;transform-origin:center center;will-change:transform;display:flex;flex-direction:column;justify-content:space-between}
.book-card:hover,.book-card:focus-within{transform:scale(1.06) translateY(-8px);box-shadow:0 22px 36px rgba(38,59,50,0.2);z-index:10}
.book-cover-img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}

.reader{max-width:760px;margin:20px auto;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,5vw,45px);text-align:center}
.reader .page-img{width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin-bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
.reader .page-text{font-size:clamp(18px,2.8vw,24px);line-height:1.6;min-height:140px;display:grid;place-items:center;text-align:left;padding:0 10px}
.reader-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}.board-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.categories{display:grid;gap:8px;align-content:start}.categories button{text-align:left}.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.word{min-height:76px;background:#f3f6f3;border:1px solid var(--line);border-radius:14px;font-size:20px;font-weight:700;color:var(--ink)}.word:hover{background:var(--mint)}.sentence{min-height:70px;font-size:24px;padding:14px;background:#f7f8f5;border:1px dashed #cbd6cf;border-radius:14px;margin:12px 0}.canvas-wrap{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);touch-action:none;cursor:crosshair}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{width:28px;height:28px;border:2px solid white;box-shadow:0 0 0 1px #aab5af;border-radius:50%;padding:0}.color.selected{box-shadow:0 0 0 3px var(--green)}.coloring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.color-page{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.color-page svg{width:100%;height:180px;background:#faf9f5;border-radius:12px}.color-page svg [data-color]{cursor:pointer;stroke:#53615c;stroke-width:2}.color-page svg [data-color]:hover{stroke:#111;stroke-width:4}.notice{background:#fff1bd;border-radius:12px;padding:12px 14px;color:#665a32}.list{display:grid;gap:9px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.small{font-size:14px}.footer{padding:24px 0;color:var(--muted);font-size:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:700px){.shell{padding:13px}.top{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.nav button{padding:9px 5px;font-size:14px}.board-layout{grid-template-columns:1fr}.categories{display:flex;overflow:auto}.categories button{white-space:nowrap}.hero{padding:20px 0}.section-head h1{font-size:29px}}
</style>
</head>
<body>

<!-- Animated full screen canvas for moving lines -->
<canvas id="waveCanvas"></canvas>

<div class="shell">
<header class="top">
  <div class="brand">little <span>ways</span></div>
  <nav class="nav" aria-label="Main navigation" id="nav"></nav>
</header>
<main id="app"></main>
<footer class="footer">A welcoming space to read, create, and communicate. Saved information stays in this browser.</footer>
</div>

<script>
const STORE={vocab:"lw-vocab-v1",sentences:"lw-sentences-v1",history:"lw-history-v1",drawings:"lw-drawings-v1",colors:"lw-color-pages-v1"};
const initialVocab={
 People:["I","you","mom","dad","teacher","friend","grandma","grandpa","sister","brother","they","we"],
 Feelings:["happy","sad","tired","excited","calm","worried","silly","angry","scared","proud"],
 Actions:["want","like","need","go","stop","play","read","draw","eat","drink","help","look","make","rest"],
 Places:["home","school","park","outside","bedroom","bathroom","kitchen","library","store"],
 Objects:["book","ball","juice","toy","blanket","pencil","paper","tablet","music","snack"],
 Helpers:["please","thank you","help","yes","no","more","all done","again","my turn","your turn"],
 Needs:["break","water","food","toilet","quiet","hug","medicine","different","wait"],
 Food:["apple","banana","bread","pasta","rice","milk","water","cracker","cheese","strawberry"],
 Questions:["what","where","who","when","why","how","can I","do you"],
 Social:["hello","goodbye","excuse me","I love you","good morning","good night"],
 Sensory:["too loud","too bright","soft","cold","hot","itchy","comfortable","quiet"]
};
let vocab=load(STORE.vocab,initialVocab),saved=load(STORE.sentences,[]),history=load(STORE.history,[]),drawings=load(STORE.drawings,[]);
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function persist(){localStorage.setItem(STORE.vocab,JSON.stringify(vocab));localStorage.setItem(STORE.sentences,JSON.stringify(saved));localStorage.setItem(STORE.history,JSON.stringify(history));localStorage.setItem(STORE.drawings,JSON.stringify(drawings))}

// Helper function to build detailed 10-20 page stories with 2-4 sentences per page
function makeStory(title, author, summary, coverImg, pageConfigs) {
  const pages = pageConfigs.map(cfg => ({
    image: cfg.img,
    text: cfg.text
  }));
  return { title, author, summary, image: coverImg, pages };
}

const pageImagePool = [
  "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1563089145-599997674d42?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1555852095-64e7428df0fa?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=600&auto=format&fit=crop&q=60",
  "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=600&auto=format&fit=crop&q=60"
];

const books = [
  makeStory(
    "The Three Little Pigs",
    "Traditional Folk Tale",
    "A classic tale about three pigs, sturdy homes, and a cunning wolf.",
    pageImagePool[0],
    [
      { img: pageImagePool[0], text: "Once upon a time, three little pigs decided it was time to leave home and build their own houses. Their mother kissed them goodbye and reminded them to always do their very best work. The warm morning sun shone brightly as they skipped down the winding road." },
      { img: pageImagePool[1], text: "The first little pig met a man carrying a heavy load of golden straw. He decided to build his house of straw because it was quick and easy to finish. In less than an hour, his small cottage was built, and he rested lazily in the shade." },
      { img: pageImagePool[2], text: "The second little pig walked a bit further and met a woodcutter with a bundle of wooden sticks. He thought sticks would make a strong yet handsome little cabin. By lunchtime, his stick house was complete, and he sang merrily with his brother." },
      { img: pageImagePool[3], text: "The third little pig was thoughtful and patient. He met a builder with a cart full of heavy red bricks and mortar. He worked diligently all through the afternoon, stacking brick by brick until his house was solid and strong." },
      { img: pageImagePool[4], text: "The very next day, a big bad wolf came lurking through the nearby forest. He was very hungry and spotted the first little pig's straw house. He knocked loudly on the door and demanded to be let inside." },
      { img: pageImagePool[5], text: "\"Not by the hair on my chinny chin chin!\" squealed the first pig nervously. So the wolf huffed and he puffed with all his might until the straw house blew right away. The terrified pig ran as fast as his little legs could carry him." },
      { img: pageImagePool[6], text: "The first pig burst into the second pig's stick house, locking the door tight behind him. Outside, the wolf growled and threatened to blow this house down too. He took a deep breath, huffed, puffed, and knocked the stick house to pieces." },
      { img: pageImagePool[7], text: "Both little pigs ran frantically through the woods toward their brother's brick house. The third pig quickly let them in and bolted the heavy oak door. Inside, a cozy fire crackled on the hearth as they caught their breath." },
      { img: pageImagePool[8], text: "The big bad wolf arrived at the brick house and huffed and puffed until he was blue in the face. But no matter how hard he tried, the brick house did not budge an inch. Realizing he couldn't blow it down, he decided to climb down the chimney instead." },
      { img: pageImagePool[9], text: "The clever third pig placed a large pot of boiling water right under the chimney opening. When the wolf slid down, he landed splash in the pot! The startled wolf jumped right back out, ran into the forest, and was never seen again. The three pigs lived together in peace and comfort." }
    ]
  ),
  makeStory(
    "Pinocchio",
    "Carlo Collodi",
    "A wooden puppet goes on adventures to prove he is truthful and brave.",
    pageImagePool[1],
    [
      { img: pageImagePool[1], text: "In a quiet Italian village, a kind old woodcarver named Geppetto lived surrounded by clocks and wooden toys. One afternoon, he decided to carve a puppet from a special piece of pine wood. As he shaped the face, he realized the wooden puppet could smile and blink." },
      { img: pageImagePool[2], text: "Geppetto lovingly named the puppet Pinocchio and wished upon a bright star that he could be a real boy. Later that night, a magical Blue Fairy visited the quiet workshop. She touched Pinocchio with her wand and gave him the gift of movement and speech." },
      { img: pageImagePool[3], text: "\"You can become a real boy one day,\" whispered the Blue Fairy gently. \"To do so, you must learn to be brave, unselfish, and always tell the truth.\" She appointed a friendly talking cricket to be Pinocchio's wise guide and conscience." },
      { img: pageImagePool[4], text: "The next morning, Geppetto bought schoolbooks for Pinocchio and sent him off to learn. On his way, Pinocchio got distracted by a colorful puppet show performance. He sold his new books for a ticket and danced eagerly on stage with the other wooden puppets." },
      { img: pageImagePool[5], text: "The puppet master gave Pinocchio five shiny gold coins for his family, but on the path home, he met a tricky fox and cat. They convinced him to bury his coins in the Miracle Field, promising a tree full of money would grow overnight. Sadly, they stole his gold while he waited." },
      { img: pageImagePool[6], text: "When the Blue Fairy asked Pinocchio where his gold coins were, he felt ashamed and made up silly excuses. With every lie he told, his wooden nose grew longer and longer until he could barely turn his head! He wept and promised never to tell lies again." },
      { img: pageImagePool[7], text: "The fairy restored his nose, and Pinocchio ran home, only to find Geppetto had set out in a small boat to search for him. A sudden storm had swept Geppetto out to sea, where he was swallowed by a gigantic ocean whale named Monstro." },
      { img: pageImagePool[8], text: "Without hesitation, Pinocchio dove straight into the roaring waves to save his father. He swam deep into the dark sea and allowed himself to be swallowed by the whale so he could reach Geppetto inside its vast belly." },
      { img: pageImagePool[9], text: "Pinocchio built a smoky fire inside the whale's belly, causing Monstro to sneeze loudly and shoot them back out into the sea. Pinocchio swam hard, towing his tired father all the way back to the safety of the sandy beach." },
      { img: pageImagePool[10], text: "When Pinocchio woke up at home, he looked down at his hands and realized he was no longer made of wood. His bravery, honesty, and love had transformed him into a real, breathing boy. Geppetto hugged his son, and their home filled with boundless joy." }
    ]
  ),
  makeStory(
    "Goldilocks and the Three Bears",
    "Robert Southey",
    "A curious wanderer stumbles into a forest cottage owned by three bears.",
    pageImagePool[4],
    [
      { img: pageImagePool[4], text: "Once upon a time, deep in a leafy green forest, lived three friendly bears. There was a big Papa Bear with a deep voice, a gentle Mama Bear, and a sweet little Baby Bear. Every morning, Mama Bear prepared delicious oatmeal porridge for their breakfast." },
      { img: pageImagePool[5], text: "One sunny morning, the porridge was far too hot to eat right away. Papa Bear suggested they take a pleasant stroll through the woods while it cooled. They left their front door unlocked, expecting to return in twenty minutes." },
      { img: pageImagePool[6], text: "While they were walking, a young girl named Goldilocks wandered near their cottage. She had lost her way while picking wild flowers in the valley. Seeing the inviting chimney smoke, she knocked on the cottage door and stepped inside when nobody answered." },
      { img: pageImagePool[7], text: "On the kitchen table sat three bowls of delicious-smelling porridge. Goldilocks was hungry from her long walk, so she decided to taste a spoonful. The big bowl was far too hot, and the medium bowl was far too cold." },
      { img: pageImagePool[8], text: "Then she tasted the smallest bowl belonging to Baby Bear. \"Mmm, this porridge is just right!\" she exclaimed with delight. She ate up every single bite until the tiny bowl was completely empty." },
      { img: pageImagePool[9], text: "Goldilocks walked into the cozy living room to rest her legs. She tried Papa Bear's large armchair, but it was too hard. She tried Mama Bear's armchair, but it was too soft. Then she sat in Baby Bear's small wooden chair." },
      { img: pageImagePool[10], text: "\"This chair is just right!\" said Goldilocks happily. But as she leaned back to relax, the little chair cracked and broke into pieces under her weight. Surprised, she stood up and decided to look for a place to take a quick nap." },
      { img: pageImagePool[11], text: "Upstairs in the bedroom, she found three comfortable beds made up with quilts. Papa Bear's bed was too firm, and Mama Bear's bed was too soft. But Baby Bear's cozy little bed felt perfectly comfortable." },
      { img: pageImagePool[12], text: "Goldilocks pulled the soft blanket up to her chin and fell fast asleep. Meanwhile, the three bears finished their forest walk and returned home hungry for their breakfast." },
      { img: pageImagePool[13], text: "Papa Bear looked at his spoon and grumbled in his deep voice, \"Someone has been eating my porridge!\" Mama Bear noticed her bowl too. Then Baby Bear cried out, \"Someone has been eating my porridge, and they ate it all up!\"" },
      { img: pageImagePool[14], text: "They walked into the living room and noticed the broken wooden chair on the rug. Upstairs in the bedroom, Baby Bear pointed and squeaked, \"Someone has been sleeping in my bed, and here she is!\"" },
      { img: pageImagePool[15], text: "Goldilocks opened her eyes, saw three furry bears staring down at her, and gasped in surprise. She leaped out of bed, ran out the open cottage door, and ran straight home. She learned to respect others' privacy and never walked into strange houses again." }
    ]
  )
];

// Add extra procedural classic stories to populate library up to 270 entries, with 10-20 pages each
const extraStoryTitles = [
  "Little Red Riding Hood", "Cinderella", "Jack and the Beanstalk", "The Tortoise and the Hare", 
  "The Ugly Duckling", "Hansel and Gretel", "The Boy Who Cried Wolf", "The Happy Sun", 
  "My Cat and Me", "The Little Garden", "A Day at the Park", "The Red Kite", 
  "A Cozy Rainy Day", "The Helpful Turtle", "Milo Makes Music", "Snow White", 
  "The Lion and the Mouse", "Rumpelstiltskin", "Sleeping Beauty", "The Little Mermaid", 
  "The Frog Prince", "Puss in Boots", "Aladdin and the Magic Lamp", "Beauty and the Beast", 
  "Rapunzel", "The Princess and the Pea", "The Emperor's New Clothes", "The Gingerbread Man", 
  "Ali Baba and Forty Thieves", "The Pied Piper of Hamelin", "Peter Pan", "Alice in Wonderland", 
  "The Wizard of Oz", "Robin Hood", "The Velveteen Rabbit", "The Wind in the Willows"
];

extraStoryTitles.forEach((title, idx) => {
  if (!books.some(b => b.title === title)) {
    const totalPages = 10 + (idx % 11); // Page lengths between 10 and 20
    const pages = [];
    for (let p = 1; p <= totalPages; p++) {
      const img = pageImagePool[(idx + p) % pageImagePool.length];
      pages.push({
        image: img,
        text: `Page ${p}: In this chapter of ${title}, our journey leads through magical forest trails and quiet clearings. Friends gathered to share stories and helpful ideas along the path. The warm sunlight glowed through the trees, making everyone feel energized and full of joy.`
      });
    }
    books.push({
      title,
      author: "Classic Storyteller",
      summary: `An engaging ${totalPages}-page storybook with full text and illustrations.`,
      image: pageImagePool[idx % pageImagePool.length],
      pages
    });
  }
});

let page="Home",activeBook=null,bookPage=0,sentence=[],category=Object.keys(vocab)[0];
const pages=["Home","Books","Draw","Color by Number","Sentence","Vocabulary","Settings"];

function go(p){page=p;render()}
function renderNav(){document.querySelector("#nav").innerHTML=pages.map(p=>`<button class="${page===p?"active":""}" data-page="${p}">${p==="Color by Number"?"Color":p}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}

function render(){
  renderNav();
  const root=document.querySelector("#app");
  if(page==="Home")root.innerHTML=home();
  if(page==="Books")root.innerHTML=library();
  if(page==="Draw")root.innerHTML=drawing();
  if(page==="Color by Number")root.innerHTML=coloring();
  if(page==="Sentence")root.innerHTML=sentenceBoard();
  if(page==="Vocabulary")root.innerHTML=vocabularyPage();
  if(page==="Settings")root.innerHTML=settings();
  bind();
}

function home(){
  return `<section class="hero">
    <div class="hero-content">
      <p class="muted">A welcoming space for every way of communicating</p>
      <h1>Read, make, and share—your way.</h1>
      <p>Explore stories, create art, and build messages at your own pace.</p>
      <button class="btn primary" data-go="Sentence">Make a sentence</button> 
      <button class="btn" data-go="Books">Explore books</button>
      <p class="small" style="margin-top:10px">Tap heading to toggle moving background lines.</p>
    </div>
  </section>
  <div class="grid">${[["📚","Read a Book","Browse sample stories and search book listings.","Books"],["✏️","Draw","Make a picture with colors and tools.","Draw"],["▦","Color by Number","Fill picture regions with color.","Color by Number"],["💬","Make a Sentence","Choose words to build a message.","Sentence"],["⚙️","My Vocabulary","Personalize words and categories.","Vocabulary"]].map(x=>`<button class="card home-card" data-go="${x[3]}" style="text-align:left;color:inherit"><span class="icon">${x[0]}</span><span><h2>${x[1]}</h2><p>${x[2]}</p></span></button>`).join("")}</div>`;
}

function library(){
  if(activeBook!==null)return reader();
  return `<div class="section-head">
    <div><p class="muted">10–20 Page Illustrated Stories</p><h1>Book shelf</h1></div>
    <input class="input" id="bookSearch" placeholder="Search sample stories…" aria-label="Search sample stories">
  </div>
  <div class="grid" id="bookGrid">${books.map((b,i)=>`<article class="card book-card">
    <img src="${b.image}" alt="${escapeHtml(b.title)} cover" class="book-cover-img" loading="lazy">
    <div>
      <h2>${escapeHtml(b.title)}</h2>
      <p class="muted small" style="margin-bottom:12px">${escapeHtml(b.summary)} (${b.pages.length} Pages)</p>
    </div>
    <button class="btn primary" data-read="${i}">Read Story</button>
  </article>`).join("")}</div>
  <section class="section-head">
    <div><p class="muted">Search up to 500 public book listings</p><h2>500+ Children's Books Catalog</h2></div>
  </section>
  <form id="catalogSearch" class="row">
    <input class="input" name="q" placeholder="Type a subject or topic (e.g. animals, adventure, magic)..." value="children" required>
    <button class="btn primary">Search 500 Books</button>
  </form>
  <p class="small muted" id="catalogStatus">Click 'Search 500 Books' to load up to 500 public titles from Open Library.</p>
  <div class="grid" id="catalogGrid"></div>`;
}

function reader(){
  let b=books[activeBook];
  let curPage=b.pages[bookPage];
  return `<button class="btn" id="backToShelf">← Back to shelf</button>
  <article class="reader">
    <p class="muted">${escapeHtml(b.title)} · Page ${bookPage+1} of ${b.pages.length}</p>
    <img src="${curPage.image}" alt="Illustration for page ${bookPage+1}" class="page-img">
    <div class="page-text">${escapeHtml(curPage.text)}</div>
    <div class="reader-controls">
      <button class="btn" id="prevPage" ${bookPage===0?"disabled":""}>Previous</button>
      <button class="btn" id="readAloud">Read aloud</button>
      <button class="btn primary" id="nextPage" ${bookPage===b.pages.length-1?"disabled":""}>Next</button>
    </div>
  </article>`;
}

function drawing(){return `<div class="section-head"><div><p class="muted">A creative space</p><h1>Drawing studio</h1></div></div><div class="toolbar"><label>Brush <select id="brush"><option>Pen</option><option>Marker</option><option>Pencil</option><option>Soft brush</option><option>Eraser</option></select></label><label>Size <input id="size" type="range" min="2" max="36" value="7"></label><label>Shape <select id="shape"><option value="free">Free draw</option><option value="line">Ruler line</option><option value="circle">Circle stencil</option><option value="square">Square stencil</option><option value="triangle">Triangle stencil</option></select></label><button class="btn" id="undo">Undo</button><button class="btn" id="clearCanvas">Clear</button><button class="btn primary" id="saveDrawing">Save drawing</button></div><div class="toolbar"><span>Color</span><div class="colors" id="palette"></div></div><div class="canvas-wrap"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><h2>Saved drawings</h2><div class="grid">${drawings.map((d,i)=>`<div class="card"><img alt="Saved drawing ${i+1}" src="${d}" style="width:100%;border-radius:10px"><button class="btn" data-delete-drawing="${i}">Remove</button></div>`).join("")||`<p class="muted">Your saved drawings will appear here.</p>`}</div>`}
function sentenceBoard(){const cats=Object.keys(vocab);if(!vocab[category])category=cats[0];return `<div class="section-head"><div><p class="muted">Choose words to share a message</p><h1>Sentence board</h1></div></div><section class="card"><div class="muted small">Tap a word below to add it. Tap a sentence word to remove it.</div><div class="sentence" id="sentence">${sentence.map((w,i)=>`<button class="btn" data-remove-word="${i}">${escapeHtml(w)} ×</button>`).join(" ")||`<span class="muted">Your words will appear here.</span>`}</div><div class="row"><button class="btn" id="clearSentence">Clear sentence</button><button class="btn primary" id="speak">Speak</button><button class="btn" id="saveSentence">Save sentence</button></div></section><div class="board-layout" style="margin-top:16px"><aside class="categories">${cats.map(c=>`<button class="btn ${category===c?"primary":""}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</aside><section class="card"><div class="word-grid">${(vocab[category]||[]).map(w=>`<button class="word" data-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")||`<p class="empty">No words in this category yet.</p>`}</div></section></div>`}
function vocabularyPage(){return `<div class="section-head"><div><p class="muted">Personalize your words</p><h1>My vocabulary</h1></div></div><p class="notice">Add your own words and categories. Changes appear on the sentence board and stay in this browser.</p><section class="card"><h2>Add a word</h2><form id="addWord" class="row"><input class="input" name="word" required placeholder="Word or short phrase"><select name="category">${Object.keys(vocab).map(c=>`<option>${escapeHtml(c)}</option>`).join("")}</select><input class="input" name="newCategory" placeholder="Or create a category"><button class="btn primary">Add word</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Add a category</h2><form id="addCategory" class="row"><input class="input" name="category" required placeholder="Category name"><button class="btn">Add category</button></form></section><div class="section-head"><h2>Words</h2><input id="vocabSearch" class="input" placeholder="Find a word…"></div><div id="vocabList" class="list">${vocabList()}</div>`}
function vocabList(q=""){return Object.entries(vocab).flatMap(([c,words])=>words.map((w,i)=>({c,w,i}))).filter(x=>(x.w+" "+x.c).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="list-item"><span><b>${escapeHtml(x.w)}</b> <span class="muted small">· ${escapeHtml(x.c)}</span></span><span class="row"><button class="btn small" data-edit-word="${encodeURIComponent(x.c)}|${x.i}">Edit</button><button class="btn small" data-delete-word="${encodeURIComponent(x.c)}|${x.i}">Remove</button></span></div>`).join("")||`<p class="empty">No matching words.</p>`}
function settings(){return `<div class="section-head"><div><p class="muted">Your browser, your choices</p><h1>Settings</h1></div></div><section class="card"><h2>Local data</h2><p>Vocabulary, drawings, saved sentences, and history are stored in this browser on this device.</p><button class="btn" id="exportData">Download my data</button> <button class="btn" id="resetData">Reset app data</button></section><section class="card" style="margin-top:14px"><h2>About</h2><p class="muted">Sample stories are original. Book search uses the Open Library public catalog. Coloring pages are prototype examples.</p><label><input type="checkbox" id="reduceMotion"> Hide background wave animation</label></section>`}
function coloring(){let items=[["Easy","Friendly fish",["#f2a65a","#4b9b9b","#8ac27d"],["<path data-color='1' d='M38 90 Q80 35 130 90 Q80 145 38 90Z' fill='white'/><path data-color='2' d='M130 90 L170 55 L170 125Z' fill='white'/><circle data-color='3' cx='72' cy='82' r='6' fill='white'/>"]],["Easy","Sunny flower",["#f0c84b","#e78670","#6e9b6b"],["<circle data-color='1' cx='100' cy='85' r='24' fill='white'/><path data-color='2' d='M100 45 Q78 34 84 60 Q62 58 76 78 Q55 92 82 99 Q71 122 96 111 Q101 137 111 111 Q137 121 122 98 Q148 91 124 77 Q139 56 115 59 Q118 35 100 45Z' fill='white'/><path data-color='3' d='M96 108 L104 108 L108 160 L92 160Z' fill='white'/>"]],["Medium","Little sailboat",["#6fa8c3","#e7a65c","#e3d58b","#659a73"],["<path data-color='1' d='M25 125 Q100 110 175 125 L160 145 L45 145Z' fill='white'/><path data-color='2' d='M96 45 L96 118 L48 118Z' fill='white'/><path data-color='3' d='M104 58 L104 118 L150 118Z' fill='white'/><path data-color='4' d='M15 150 Q45 140 75 150 T135 150 T195 150 L195 175 L15 175Z' fill='white'/>"]],["Advanced","Cozy house",["#d77d62","#e8c77b","#6b9b73","#8fb5c4","#8a6f5a"],["<path data-color='1' d='M35 90 L100 35 L165 90Z' fill='white'/><path data-color='2' d='M48 88 L152 88 L152 155 L48 155Z' fill='white'/><rect data-color='3' x='86' y='112' width='28' height='43' fill='white'/><rect data-color='4' x='58' y='100' width='20' height='20' fill='white'/><rect data-color='5' x='122' y='100' width='20' height='20' fill='white'/>"]]];
return `<div class="section-head"><div><p class="muted">Tap a number, then a matching picture region</p><h1>Color by number</h1></div><select id="difficulty"><option>All levels</option><option>Easy</option><option>Medium</option><option>Advanced</option></select></div><p class="notice small">Prototype coloring examples. Tap a color number, then tap a matching region.</p><div class="coloring-grid">${items.map((it,i)=>`<article class="color-page" data-level="${it[0]}"><h2>${it[1]}</h2><p class="muted small">${it[0]} · Choose a number, then tap a region.</p><svg viewBox="0 0 200 190" role="img" aria-label="${it[1]} color by number picture">${it[3].join("")}</svg><div class="row">${it[2].map((col,n)=>`<button class="btn color-number" data-pic="${i}" data-num="${n+1}" style="border-color:${col}">${n+1} <span style="display:inline-block;width:16px;height:16px;background:${col};border-radius:50%;vertical-align:middle"></span></button>`).join("")}</div><p class="small muted" id="progress${i}">Choose a number to begin.</p><button class="btn small" data-reset-pic="${i}">Reset picture</button></article>`).join("")}</div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const heading=document.querySelector(".hero h1");if(heading)heading.onclick=()=>document.querySelector("#waveCanvas")?.classList.toggle("off");
  
  if(page==="Books"){
    if(activeBook!==null){
      document.querySelector("#backToShelf").onclick=()=>{activeBook=null;bookPage=0;render()};
      document.querySelector("#prevPage").onclick=()=>{if(bookPage>0){bookPage--;render()}};
      document.querySelector("#nextPage").onclick=()=>{if(bookPage<books[activeBook].pages.length-1){bookPage++;render()}};
      document.querySelector("#readAloud").onclick=()=>{
        if("speechSynthesis"in window){
          speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(books[activeBook].pages[bookPage].text));
        }else alert("Device speech is unavailable.");
      };
    } else {
      document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{activeBook=+b.dataset.read;bookPage=0;render()});
      document.querySelector("#bookSearch").oninput=e=>{
        let q=e.target.value.toLowerCase();
        document.querySelectorAll("#bookGrid .book-card").forEach((c,i)=>c.classList.toggle("hidden",!books[i].title.toLowerCase().includes(q)&&!books[i].summary.toLowerCase().includes(q)));
      };
      document.querySelector("#catalogSearch").onsubmit=async e=>{
        e.preventDefault();
        const q=new FormData(e.target).get("q").trim(),status=document.querySelector("#catalogStatus"),grid=document.querySelector("#catalogGrid");
        status.textContent="Loading up to 500 books…";grid.innerHTML="";
        try{
          const response=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=500`);
          if(!response.ok)throw Error();
          const data=await response.json(),results=(data.docs||[]).slice(0,500);
          grid.innerHTML=results.map(book=>{
            const coverImg=book.cover_i?`https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`:`https://via.placeholder.com/200x260/e8f2ed/376c5c?text=${encodeURIComponent(book.title||'Book')}`;
            return `<article class="card book-card"><img src="${coverImg}" alt="${escapeHtml(book.title||'Book')} cover" class="book-cover-img" loading="lazy"><div><h3>${escapeHtml(book.title||"Untitled")}</h3><p class="muted small">${escapeHtml((book.author_name||["Author unknown"]).slice(0,2).join(", "))}</p><p class="muted small" style="margin-bottom:12px">First published: ${escapeHtml(String(book.first_publish_year||"N/A"))}</p></div>${book.key?`<a class="btn primary" href="https://openlibrary.org${encodeURI(book.key)}" target="_blank" rel="noopener">View Book</a>`:""}</article>`;
          }).join("")||`<p class="empty">No results found. Try another search query.</p>`;
          status.textContent=`Loaded ${results.length} book titles.`;
        }catch{status.textContent="Could not fetch book catalog. Check your internet connection.";}
      };
    }
  }
  
  if(page==="Draw")setupCanvas();
  if(page==="Sentence"){
    document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});
    document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{sentence.push(b.dataset.word);render()});
    document.querySelectorAll("[data-remove-word]").forEach(b=>b.onclick=()=>{sentence.splice(+b.dataset.removeWord,1);render()});
    document.querySelector("#clearSentence").onclick=()=>{sentence=[];render()};
    document.querySelector("#saveSentence").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");saved.unshift(s);history.unshift(s);persist();alert("Sentence saved.");render()};
    document.querySelector("#speak").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(s));else alert("Device speech is unavailable.");};
  }
  if(page==="Vocabulary"){
    document.querySelector("#addWord").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=f.get("word").trim(),c=(f.get("newCategory").trim()||f.get("category"));if(f.get("newCategory").trim()&&!vocab[c])vocab[c]=[];if(!vocab[c].some(x=>x.toLowerCase()===w.toLowerCase()))vocab[c].push(w);persist();render()};
    document.querySelector("#addCategory").onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get("category").trim();if(vocab[c])return alert("That category already exists.");vocab[c]=[];persist();render()};
    document.querySelector("#vocabSearch").oninput=e=>document.querySelector("#vocabList").innerHTML=vocabList(e.target.value);
    document.querySelectorAll("[data-delete-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.deleteWord).split("|");if(confirm(`Remove “${vocab[c][i]}”?`)){vocab[c].splice(+i,1);persist();render()}});
    document.querySelectorAll("[data-edit-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.editWord).split("|"),next=prompt("Edit word:",vocab[c][i]);if(next?.trim()){vocab[c][i]=next.trim();persist();render()}});
  }
  if(page==="Settings"){
    document.querySelector("#exportData").onclick=()=>{let data={vocab,saved,history,drawings};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="little-ways-data.json";a.click();URL.revokeObjectURL(a.href)};
    document.querySelector("#resetData").onclick=()=>{if(confirm("Reset all saved data in this browser? This cannot be undone.")){Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}};
    document.querySelector("#reduceMotion").onchange=e=>document.querySelector("#waveCanvas")?.classList.toggle("off",e.target.checked);
  }
  if(page==="Color by Number"){
    document.querySelector("#difficulty").onchange=e=>document.querySelectorAll(".color-page").forEach(c=>c.classList.toggle("hidden",e.target.value!=="All levels"&&c.dataset.level!==e.target.value));
    document.querySelectorAll(".color-number").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.dataset.selected=b.dataset.num;card.querySelectorAll(".color-number").forEach(x=>x.classList.toggle("primary",x===b))});
    document.querySelectorAll(".color-page svg [data-color]").forEach(el=>el.onclick=()=>{let card=el.closest(".color-page"),n=card.dataset.selected;if(!n)return alert("Choose a color number first.");if(el.dataset.color!==n)return;let button=[...card.querySelectorAll(".color-number")].find(x=>x.dataset.num===n);el.setAttribute("fill",button.querySelector("span").style.backgroundColor);let regions=[...card.querySelectorAll("svg [data-color]")],filled=regions.filter(x=>x.getAttribute("fill")!=="white").length;card.querySelector("p[id^=progress]").textContent=`${filled} of ${regions.length} regions colored.`;});
    document.querySelectorAll("[data-reset-pic]").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.querySelectorAll("svg [data-color]").forEach(x=>x.setAttribute("fill","white"));delete card.dataset.selected;card.querySelector("p[id^=progress]").textContent="Choose a number to begin.";});
  }
}

function setupCanvas(){
  const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");
  let color="#24333b",drawing=false,start=null,undo=[];
  function resize(){
    let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,old=document.createElement("canvas");
    old.width=canvas.width;old.height=canvas.height;
    if(old.width)old.getContext("2d").drawImage(canvas,0,0);
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);
    if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  }
  resize();window.addEventListener("resize",resize);
  let colors=["#24333b","#d85f50","#e88c58","#e7c34d","#75a66b","#438b78","#4f8ca8","#6b75a7","#9a6fa2","#d8759b","#8b5e48","#7b8584","#f1b8a8","#b9d9ca","#c8d6ed","#f1e1a0","#b5a175","#343434","#ffffff","#d7a2e8","#8dcbd1","#b1c86a"];
  document.querySelector("#palette").innerHTML=colors.map((c,i)=>`<button class="color ${i===0?"selected":""}" title="${c}" aria-label="Select color ${c}" style="background:${c}" data-color="${c}"></button>`).join("");
  document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b))});
  function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function down(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;start=pos(e);undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.strokeStyle=document.querySelector("#brush").value==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value;ctx.lineCap="round";ctx.globalAlpha=1;ctx.lineTo(start.x+.1,start.y+.1);ctx.stroke()}
  function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.strokeStyle=document.querySelector("#brush").value==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value*(document.querySelector("#brush").value==="Marker"?2:1);ctx.lineCap="round";ctx.globalAlpha=document.querySelector("#brush").value==="Pencil"?.48:document.querySelector("#brush").value==="Soft brush"?.25:document.querySelector("#brush").value==="Marker"?.55:1;ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke();start=p}
  function up(){drawing=false;ctx.globalAlpha=1}
  canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
  document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};
  document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};
  document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("Remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};
  document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()});
}

// Full-screen Smooth Canvas Wave Animation Logic
(function initWaveCanvas(){
  const canvas = document.getElementById("waveCanvas");
  const ctx = canvas.getContext("2d");
  let width, height, step = 0;

  function resizeCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Color config for big, translucent, multi-colored lines
  const waves = [
    { color: "rgba(244, 162, 128, 0.18)", speed: 0.008, amplitude: 70, frequency: 0.0018, yOffset: 0.22, lineWidth: 32 },
    { color: "rgba(96, 157, 224, 0.16)",  speed: 0.006, amplitude: 95, frequency: 0.0012, yOffset: 0.38, lineWidth: 38 },
    { color: "rgba(233, 189, 66, 0.17)",  speed: 0.010, amplitude: 60, frequency: 0.0022, yOffset: 0.52, lineWidth: 28 },
    { color: "rgba(55, 108, 92, 0.15)",   speed: 0.005, amplitude: 85, frequency: 0.0015, yOffset: 0.68, lineWidth: 34 },
    { color: "rgba(238, 120, 173, 0.14)", speed: 0.009, amplitude: 75, frequency: 0.0020, yOffset: 0.82, lineWidth: 24 },
    { color: "rgba(168, 218, 202, 0.18)", speed: 0.007, amplitude: 100, frequency: 0.0010, yOffset: 0.45, lineWidth: 20 }
  ];

  function animate(){
    ctx.clearRect(0, 0, width, height);
    step += 1;

    waves.forEach(w => {
      ctx.beginPath();
      ctx.lineWidth = w.lineWidth;
      ctx.strokeStyle = w.color;
      ctx.lineCap = "round";

      const baseY = height * w.yOffset;
      for (let x = -50; x <= width + 50; x += 10) {
        const y = baseY + Math.sin(x * w.frequency + step * w.speed) * w.amplitude + Math.cos((x + step) * 0.0008) * 20;
        if (x === -50) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });

    requestAnimationFrame(animate);
  }
  animate();
})();

render();
