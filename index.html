body.bg-sentence{background-color:#fff5f5}

body.bg-settings{background-color:#f8fafc}

#bgCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;transition:opacity 0.4s ease}

.shell{position:relative;z-index:1;max-width:1180px;margin:auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}

.brand span{color:var(--yellow)}
.nav{display:flex;gap:7px;flex-wrap:wrap}
.nav button,.btn{border:1px solid #fef08a;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:650}
.nav button.active,.btn.primary{background:var(--yellow);color:#000000;border-color:var(--yellow);font-weight:700}
.nav button.active:hover,.btn.primary:hover{background:var(--yellow-hover);color:#ffffff}
.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
main{min-height:65vh}

.hero{position:relative;background:rgba(255,255,255,0.96);backdrop-filter:blur(14px);border:1px solid #fef08a;border-radius:24px;padding:clamp(28px,6vw,50px);margin-bottom:24px;box-shadow:0 12px 32px rgba(234,179,8,0.15)}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.08;max-width:720px;margin:0 0 16px;letter-spacing:-1.5px;color:#133c55}
.hero p{font-size:19px;color:#43617b;max-width:640px;margin:0 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:1px solid #fef08a;border-radius:18px;padding:20px;box-shadow:var(--shadow)}

.home-card .icon{font-size:28px;color:var(--yellow)}
.home-card h2{font-size:20px;margin:8px 0 2px;color:#133c55}
.home-card p,.muted{color:var(--muted);margin:0}

.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}
.section-head h1{margin:0;font-size:34px;letter-spacing:-1px;color:#133c55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input,select,textarea{border:1px solid #fef08a;border-radius:10px;padding:11px 12px;background:rgba(255,255,255,0.95);color:var(--ink)}
.input{min-width:190px}

.book-card{position:relative;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s ease;transform-origin:center center;display:flex;flex-direction:column;justify-content:space-between}
.book-card:hover{transform:scale(1.05) translateY(-6px);box-shadow:0 22px 36px rgba(234,179,8,0.25);z-index:10}
.book-cover-img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08)}

.badge-btn{background:rgba(255,255,255,0.95);backdrop-filter:blur(4px);border:1px solid #fef08a;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:16px;cursor:pointer;transition:all 0.2s}
.badge-btn.star-btn.active{background:#fef9c3;border-color:#eab308;color:#eab308}
.badge-btn.heart-btn.active{background:#ffebee;border-color:#ff1744;color:#ff1744}

.reader-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}

.board-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
.categories{display:grid;gap:8px;align-content:start}
.categories button{text-align:left}
.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}

.sentence{min-height:70px;font-size:24px;padding:14px;background:rgba(254,249,195,0.5);border:1px dashed #eab308;border-radius:14px;margin:12px 0}

.canvas-wrap{background:white;border:1px solid #fef08a;border-radius:16px;overflow:hidden;touch-action:none;box-shadow:var(--shadow)}
.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);touch-action:none;cursor:crosshair}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.color{width:28px;height:28px;border:2px solid white;box-shadow:0 0 0 1px #eab308;border-radius:50%;padding:0}
.color.selected{box-shadow:0 0 0 3px #eab308}

.stencil-card{position:relative;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border:1px solid #fef08a;border-radius:16px;padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stencil-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.stencil-display{font-size:42px;font-weight:800;color:#133c55;margin:8px 0;line-height:1}
.custom-badge{position:absolute;top:10px;right:10px;width:10px;height:10px;background:#2e7d32;border-radius:50%}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:20px}
.modal-content{background:white;border-radius:24px;max-width:920px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.25);position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:#fef9c3;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}

.notice{background:#fef9c3;border-radius:12px;padding:12px 14px;color:#713f12;border:1px solid #fef08a}
.list{display:grid;gap:9px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid #fef08a;border-radius:12px;padding:12px}
.small{font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hidden{display:none!important}

];

const topicNames = [
  "Counting Objects", "Shapes Recognition", "Sides of Shapes", "Simple Addition", 
  "Subtraction Basics", "Number Patterns", "Measurement & Size", "Word Problems", 
  "Data & Graphs", "Advanced Mastery"
];

const mathCategories = mathGradeSubjects.map((subject, sIdx) => {
  if(subject === "Kindergarten"){
    return { id: `math-sub-${sIdx}`, name: "Kindergarten Mathematics", category: subject, parts: kindergartenParts };
  }
  const parts = [];
  for(let p = 1; p <= 10; p++){
    const questions = [];
    const topic = topicNames[p - 1];
    for(let q = 1; q <= 10; q++){
      let val = (sIdx + 1) * p + q;
      let qText = `${subject} — ${topic} (Q${q}): Evaluate expression ${val} + ${q} * 2`;
      let ans = `${val + q * 2}`;
      let opts = [`${val + q * 2}`, `${val + q + 5}`, `${Math.max(0, val - q)}`, `${val + 10}`];
      opts.sort(() => Math.random() - 0.5);
      questions.push({ q: qText, options: opts, answer: ans });
    }
    parts.push({ partNum: p, topic, questions });
  }
  return { id: `math-sub-${sIdx}`, name: `${subject} Mathematics`, category: subject, parts };
});

  document.querySelector("#closeModal").onclick = () => modal.classList.add("hidden");

  const sc = document.getElementById("stencilCanvas");
  const sctx = sc.getContext("2d");
  let drawing = false, start = null;

  function resizeStencil(){
    let r = sc.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    sc.width = r.width * dpr; sc.height = r.height * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.fillStyle = "white"; sctx.fillRect(0, 0, r.width, r.height);
  }
  setTimeout(resizeStencil, 50);

  function pos(e){ let r = sc.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function down(e){ e.preventDefault(); sc.setPointerCapture(e.pointerId); drawing = true; start = pos(e); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    let p = pos(e);
    sctx.beginPath();
    sctx.strokeStyle = "#eab308";
    sctx.lineWidth = 10;
    sctx.lineCap = "round";
    sctx.moveTo(start.x, start.y);
    sctx.lineTo(p.x, p.y);
    sctx.stroke();
    start = p;
  }
  function up(e){ drawing = false; try{ sc.releasePointerCapture(e.pointerId); }catch(err){} }

  sc.addEventListener("pointerdown", down);
  sc.addEventListener("pointermove", move);
  sc.addEventListener("pointerup", up);

  document.getElementById("clearStencilCanvas").onclick = () => {
    sctx.fillStyle = "white";
    sctx.fillRect(0, 0, sc.width, sc.height);
  };
}

    document.querySelectorAll(".math-opt-btn").forEach(btn => btn.onclick = () => {

            <button class="btn primary" id="nextPartBtn">${activeMathPart < 10 ? `Start Part ${activeMathPart + 1}` : 'Return to Subjects'}</button>

    document.querySelector("#saveSentence").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");saved.unshift(s);history.unshift(s);persist();alert("Sentence saved.");render()};
    document.querySelector("#speak").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(s));else alert("Device speech is unavailable.");};

  if(page==="Vocabulary"){

    document.querySelector("#addCategory").onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get("category").trim();if(vocab[c])return alert("That category already exists.");vocab[c]=[];persist();render()};

    document.querySelector("#resetData").onclick=()=>{if(confirm("Reset all saved data in this browser? This cannot be undone.")){Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}};

function setupCanvas(){
  const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");
  let drawing=false,start=null,undo=[];
  
  function resize(){
    let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,old=document.createElement("canvas");
    old.width=canvas.width;old.height=canvas.height;
    if(old.width)old.getContext("2d").drawImage(canvas,0,0);
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);
    if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  }
  resize();window.addEventListener("resize",resize);

  document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{
    activeColor=b.dataset.color;
    document.querySelector("#nativeColorPicker").value = activeColor;
    document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b));
  });

  document.querySelector("#nativeColorPicker").oninput=(e)=>{ activeColor = e.target.value; };

  document.querySelector("#saveCurrentColorBtn").onclick = () => {
    if(!savedColors.includes(activeColor)){
      savedColors.push(activeColor);
      persist();
      const countEl = document.querySelector("#savedCount");
      if(countEl) countEl.textContent = savedColors.length;
      alert(`Color ${activeColor} saved to Saved Colors!`);
    } else {
      alert("This color is already in your Saved Colors.");
    }
  };

  document.querySelector("#moreColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Expanded Color Palette (72 Vibrant Colors)</h2>
      <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
        ${vibrantPalette72.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-col="${c}"></button>`).join("")}
      </div>
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-col]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickCol;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#savedColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Saved Colors</h2>
      ${savedColors.length === 0 ? '<p class="empty">No saved colors yet. Click "Save Color" in the studio.</p>' : `
        <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
          ${savedColors.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-saved="${c}"></button>`).join("")}
        </div>
      `}
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-saved]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickSaved;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#brush").onchange=(e)=>{ activeBrush = e.target.value; };

  function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function down(e){
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drawing=true;
    start=pos(e);
    undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));

    if(activeBrush === "Stamp"){
      drawStamp(start.x, start.y);
    }
  }
  
  function drawStamp(x, y) {
    ctx.save();
    ctx.fillStyle = activeColor;
    ctx.font = "28px sans-serif";
    const symbols = ["⭐", "❤️", "🌸", "☀️", "🍀", "🎨"];
    const sym = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(sym, x - 12, y + 10);
    ctx.restore();
  }

  function move(e){
    if(!drawing)return;
    e.preventDefault();
    let p=pos(e);
    const brush = activeBrush;
    const sz = +document.querySelector("#size").value;

    if (brush === "Stamp") {
      if(Math.hypot(p.x - start.x, p.y - start.y) > 25) {
        drawStamp(p.x, p.y);
        start = p;
      }
      return;
    }

    if (brush === "Wispy Paintbrush") {
      for (let i = -sz/2; i <= sz/2; i += 3) {
        ctx.beginPath();
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.35;
        ctx.moveTo(start.x + i, start.y + (Math.random()*4-2));
        ctx.lineTo(p.x + i, p.y + (Math.random()*4-2));
        ctx.stroke();
      }
    } else if (brush === "Watercolor") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 2.5;
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.22;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Crayon") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.4;
      ctx.lineCap = "butt";
      ctx.globalAlpha = 0.65;
      for(let d=0; d<5; d++) {
        let ox = (Math.random()-0.5)*sz*0.8;
        let oy = (Math.random()-0.5)*sz*0.8;
        ctx.moveTo(start.x+ox, start.y+oy);
        ctx.lineTo(p.x+ox, p.y+oy);
      }
      ctx.stroke();
    } else if (brush === "Pencil") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = Math.max(1, sz * 0.35);
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.85;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.fillStyle = activeColor;
      for(let k=0; k<3; k++){
        let dx = p.x + (Math.random()-0.5)*sz*1.5;
        let dy = p.y + (Math.random()-0.5)*sz*1.5;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(dx, dy, 1.2, 1.2);
      }
    } else if (brush === "Marker") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "square";
      ctx.globalAlpha = 0.95;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Eraser") {
      ctx.beginPath();
      ctx.strokeStyle = "white";
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "round";
      ctx.globalAlpha = 1.0;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    start=p;
  }
  
  function up(e){
    if(drawing) {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    }
    drawing=false;
    ctx.globalAlpha=1;
  }
  
  canvas.addEventListener("pointerdown",down);
  canvas.addEventListener("pointermove",move);
  canvas.addEventListener("pointerup",up);
  canvas.addEventListener("pointercancel",up);

  document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};
  document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};
  document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("Remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};
  document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()});
}

(function initWordBg(){
  const canvas = document.getElementById("bgCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width, height;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const backgroundWords = [
    "Read", "Create", "Communicate", "Joy", "Story", "Paint", "Spark", "Voice", "Dream", "Imagine",
    "Friend", "Listen", "Play", "Smile", "Happy", "Together", "Colors", "Books", "Words", "Feelings",
    "Kindness", "Hope", "Explore", "Write", "Draw", "Share", "Peace", "Quiet", "Magic", "Journey",
    "Love", "Help", "Want", "Need", "Calm", "Brave", "Brilliant", "Shine", "Grow", "Connect", "Learn", "Mind"
  ];

  const vibrantColors = [
    [234, 179, 8], [255, 145, 0], [255, 234, 0], [0, 230, 118], [0, 176, 255], [224, 64, 251]
  ];

  const wordParticles = [];
  for (let i = 0; i < 45; i++) {
    const col = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];
    wordParticles.push({
      text: backgroundWords[Math.floor(Math.random() * backgroundWords.length)],
      x: Math.random() * width,
      y: Math.random() * height,
      fontSize: 14 + Math.floor(Math.random() * 14),
      color: col,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      alpha: 0.25 + Math.random() * 0.35
    });
  }

  function animate(){
    ctx.clearRect(0, 0, width, height);
    wordParticles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -100) p.x = width + 100;
      if (p.x > width + 100) p.x = -100;
      if (p.y < -60) p.y = height + 60;
      if (p.y > height + 60) p.y = -60;

      ctx.font = `600 ${p.fontSize}px system-ui, sans-serif`;
      ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha})`;
      ctx.fillText(p.text, p.x, p.y);
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

render();
</script>
