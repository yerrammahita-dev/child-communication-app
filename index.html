<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Ways — Read, Create, Communicate</title>
<style>
:root{--ink:#24333b;--muted:#68777c;--paper:#fbfaf7;--white:#fff;--line:#e4e8e5;--green:#376c5c;--mint:#e8f2ed;--coral:#f4e3dc;--blue:#e5eef3;--yellow:#f5efd9;--shadow:0 8px 26px #263b3210}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e4a44b;outline-offset:3px}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--green)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:650}.nav button.active,.btn.primary{background:var(--green);color:white;border-color:var(--green)}.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}main{min-height:65vh}.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#fff1b9,#ffe1ef 52%,#dceeff);padding:clamp(28px,6vw,68px);margin-bottom:24px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.04;max-width:650px;margin:0 0 16px;letter-spacing:-2px}.hero p{font-size:19px;color:#52645d;max-width:590px}.squiggles{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}.squiggles.off{opacity:0!important}.squiggles svg{position:absolute;width:100%;height:100%;inset:0}.squiggles path{fill:none;stroke-width:22;opacity:.28;stroke-linecap:round;filter:blur(1px);animation:drift 9s ease-in-out infinite alternate}.squiggles path:nth-child(2){animation-delay:-3s}.squiggles path:nth-child(3){animation-delay:-6s}@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(25px,-18px)}}.hero-content{position:relative;z-index:1}.hero .btn{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.home-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.home-card .icon{font-size:28px}.home-card h2{font-size:20px;margin:8px 0 2px}.home-card p,.muted{color:var(--muted);margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}.section-head h1{margin:0;font-size:34px;letter-spacing:-1px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,select,textarea{border:1px solid #d9e0dc;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}.input{min-width:190px}

/* 3D Bulging Hover Effect for Books */
.book-card{transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s ease;transform-origin:center center;will-change:transform;display:flex;flex-direction:column;justify-content:space-between}
.book-card:hover,.book-card:focus-within{transform:scale(1.06) translateY(-8px);box-shadow:0 22px 36px rgba(38,59,50,0.2);z-index:10}
.book-cover-img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}

.reader{max-width:760px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,55px);text-align:center}.reader .page-text{font-size:clamp(24px,4vw,36px);line-height:1.45;min-height:180px;display:grid;place-items:center}.reader-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.board-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.categories{display:grid;gap:8px;align-content:start}.categories button{text-align:left}.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.word{min-height:76px;background:#f3f6f3;border:1px solid var(--line);border-radius:14px;font-size:20px;font-weight:700;color:var(--ink)}.word:hover{background:var(--mint)}.sentence{min-height:70px;font-size:24px;padding:14px;background:#f7f8f5;border:1px dashed #cbd6cf;border-radius:14px;margin:12px 0}.canvas-wrap{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);touch-action:none;cursor:crosshair}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{width:28px;height:28px;border:2px solid white;box-shadow:0 0 0 1px #aab5af;border-radius:50%;padding:0}.color.selected{box-shadow:0 0 0 3px var(--green)}.coloring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.color-page{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.color-page svg{width:100%;height:180px;background:#faf9f5;border-radius:12px}.color-page svg [data-color]{cursor:pointer;stroke:#53615c;stroke-width:2}.color-page svg [data-color]:hover{stroke:#111;stroke-width:4}.notice{background:#fff1bd;border-radius:12px;padding:12px 14px;color:#665a32}.list{display:grid;gap:9px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.small{font-size:14px}.footer{padding:24px 0;color:var(--muted);font-size:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:700px){.shell{padding:13px}.top{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.nav button{padding:9px 5px;font-size:14px}.board-layout{grid-template-columns:1fr}.categories{display:flex;overflow:auto}.categories button{white-space:nowrap}.hero{padding:30px 22px}.section-head h1{font-size:29px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">little <span>ways</span></div>
  <nav class="nav" aria-label="Main navigation" id="nav"></nav>
</header>
<main id="app"></main>
<footer class="footer">A welcoming space to read, create, and communicate. Saved information stays in this browser.</footer>
</div>
<script>
const STORE={vocab:"lw-vocab-v1",sentences:"lw-sentences-v1",history:"lw-history-v1",drawings:"lw-drawings-v1",colors:"lw-color-pages-v1"};
const initialVocab={
 People:["I","you","mom","dad","teacher","friend","grandma","grandpa","sister","brother","they","we"],
 Feelings:["happy","sad","tired","excited","calm","worried","silly","angry","scared","proud"],
 Actions:["want","like","need","go","stop","play","read","draw","eat","drink","help","look","make","rest"],
 Places:["home","school","park","outside","bedroom","bathroom","kitchen","library","store"],
 Objects:["book","ball","juice","toy","blanket","pencil","paper","tablet","music","snack"],
 Helpers:["please","thank you","help","yes","no","more","all done","again","my turn","your turn"],
 Needs:["break","water","food","toilet","quiet","hug","medicine","different","wait"],
 Food:["apple","banana","bread","pasta","rice","milk","water","cracker","cheese","strawberry"],
 Questions:["what","where","who","when","why","how","can I","do you"],
 Social:["hello","goodbye","excuse me","I love you","good morning","good night"],
 Sensory:["too loud","too bright","soft","cold","hot","itchy","comfortable","quiet"]
};
let vocab=load(STORE.vocab,initialVocab),saved=load(STORE.sentences,[]),history=load(STORE.history,[]),drawings=load(STORE.drawings,[]);
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function persist(){localStorage.setItem(STORE.vocab,JSON.stringify(vocab));localStorage.setItem(STORE.sentences,JSON.stringify(saved));localStorage.setItem(STORE.history,JSON.stringify(history));localStorage.setItem(STORE.drawings,JSON.stringify(drawings))}

const books = [
{title:"The Three Little Pigs",author:"Traditional Folk Tale",image:"https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=400&auto=format&fit=crop&q=60",summary:"A classic story about building sturdy houses.",pages:["Three little pigs built houses of straw, sticks, and bricks.","A wolf blew down the first two houses easily.","The third pig welcomed his brothers into his brick house.","The wolf could not blow down the brick house."]},
{title:"Pinocchio",author:"Carlo Collodi",image:"https://images.unsplash.com/photo-1563089145-599997674d42?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a puppet becoming real.",pages:["Geppetto carved a wooden puppet named Pinocchio.","Pinocchio's nose grew longer whenever he told a lie.","He faced many trials and learned to be honest.","The fairy transformed Pinocchio into a real boy."]},
{title:"Little Red Riding Hood",author:"Charles Perrault",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a forest journey.",pages:["Little Red Riding Hood carried treats to grandmother.","A sneaky wolf ran ahead and pretended to be grandmother.","Red Riding Hood noticed grandmother's unusually big teeth.","A brave woodsman saved Red Riding Hood and grandmother."]},
{title:"Cinderella",author:"Charles Perrault",image:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a glass slipper and ball.",pages:["Cinderella lived with her unkind stepfamily.","Her Fairy Godmother helped her attend the royal ball.","She danced with the prince but lost her glass slipper.","The prince found Cinderella and they lived happily."]},
{title:"Goldilocks and the Three Bears",author:"Robert Southey",image:"https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=400&auto=format&fit=crop&q=60",summary:"A classic story about exploring a cottage.",pages:["Goldilocks wandered into a house owned by three bears.","She tried three bowls of porridge and three beds.","She fell fast asleep in Baby Bear's cozy bed.","The bears returned home and Goldilocks ran back home."]},
{title:"Jack and the Beanstalk",author:"English Folk Tale",image:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a giant beanstalk.",pages:["Jack traded his cow for a handful of magic beans.","A giant beanstalk grew high into the sky overnight.","Jack climbed up and found a giant's castle.","He safely climbed down and chopped down the stalk."]},
{title:"The Tortoise and the Hare",author:"Aesop",image:"https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a steady race.",pages:["Hare made fun of Tortoise and challenged him to a race.","Hare ran ahead and stopped to take a nap.","Tortoise kept walking step by step without stopping.","Tortoise crossed the finish line while Hare was asleep."]},
{title:"The Ugly Duckling",author:"Hans Christian Andersen",image:"https://images.unsplash.com/photo-1555852095-64e7428df0fa?w=400&auto=format&fit=crop&q=60",summary:"A classic story about growing up beautiful.",pages:["A duckling hatched looking different from all the others.","He spent seasons wandering alone and feeling left out.","When spring arrived, he looked into the clear water.","He realized he had grown into a beautiful white swan."]},
{title:"Hansel and Gretel",author:"Brothers Grimm",image:"https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop&q=60",summary:"A classic story about a house of sweets.",pages:["Hansel and Gretel got lost in the deep forest.","They discovered a cottage made of gingerbread and candy.","A tricky witch trapped them, but Gretel outsmarted her.","They escaped safely and brought treasures back home."]},
{title:"The Boy Who Cried Wolf",author:"Aesop",image:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=400&auto=format&fit=crop&q=60",summary:"A classic story about learning honesty.",pages:["A shepherd boy raised false alarms about a wolf.","The villagers ran to help but found it was a joke.","When a real wolf came, the boy shouted for help.","No one came to help, teaching him to tell the truth."]},
{title:"The Happy Sun",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&auto=format&fit=crop&q=60",summary:"A sunny day brings small surprises.",pages:["The sun woke up over the quiet town.","A little bird waved from a tree.","The sun warmed the garden and the people in it.","At evening, the sun said goodnight."]},
{title:"My Cat and Me",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&auto=format&fit=crop&q=60",summary:"A child and a curious cat explore at home.",pages:["My cat has soft paws and bright eyes.","We look for a sunny place to sit.","A paper ball rolls across the room.","At bedtime, my cat curls up beside me."]},
{title:"The Little Garden",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=400&auto=format&fit=crop&q=60",summary:"Seeds, water, and patience help a garden grow.",pages:["We planted tiny seeds in the soil.","The rain came softly in the morning.","Green leaves reached toward the light.","Soon, flowers opened in the garden."]},
{title:"A Day at the Park",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=400&auto=format&fit=crop&q=60",summary:"A friendly day outdoors with room to explore.",pages:["We walked to the park together.","I saw a duck near the pond.","We played, rested, and shared a snack.","The sky turned gold as we went home."]},
{title:"The Red Kite",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=400&auto=format&fit=crop&q=60",summary:"A kite finds its way into the breeze.",pages:["I carried my red kite to the hill.","The wind lifted it gently.","It danced high above the grass.","We folded it carefully and went home."]},
{title:"A Cozy Rainy Day",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=400&auto=format&fit=crop&q=60",summary:"A rainy day becomes a chance to make things.",pages:["Rain tapped softly on the window.","We chose a book and warm socks.","Then we drew a picture of the clouds.","The rain stopped, and the sun came out."]},
{title:"The Helpful Turtle",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?w=400&auto=format&fit=crop&q=60",summary:"A slow and thoughtful turtle helps a friend.",pages:["Turtle heard a small voice by the path.","A little beetle had lost its way.","Turtle walked with the beetle to the flowers.","They waved goodbye beneath a leaf."]},
{title:"Milo Makes Music",author:"An original Little Ways story",image:"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=60",summary:"Everyday sounds become a cheerful song.",pages:["Milo tapped a spoon on a bowl.","A friend shook a box of buttons.","They listened, then played together.","Their little song filled the room."]},
{title:"Snow White",author:"Brothers Grimm",image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400&auto=format&fit=crop&q=60",summary:"A story about a princess and seven friendly dwarfs.",pages:["Snow White escaped into the forest.","She found a tiny house where seven dwarfs lived.","The dwarfs welcomed her into their home.","A prince helped her live happily ever after."]},
{title:"The Lion and the Mouse",author:"Aesop",image:"https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=400&auto=format&fit=crop&q=60",summary:"A story showing small friends can be great helpers.",pages:["A lion let a tiny mouse go free.","Later, the lion was caught in a hunter's net.","The little mouse chewed through the strong ropes.","The lion was free thanks to his small friend."]},
{title:"Rumpelstiltskin",author:"Brothers Grimm",image:"https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop&q=60",summary:"A tale about spinning straw into gold.",pages:["A mysterious man spun straw into gold.","He asked for a secret in return.","She had to guess his unusual name.","She guessed Rumpelstiltskin and was free."]},
{title:"Sleeping Beauty",author:"Charles Perrault",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=60",summary:"A princess falls into a long sleep.",pages:["Princess Aurora pricked her finger on a spindle.","The kingdom fell into a long sleep.","A brave prince found the hidden castle.","The spell was broken and joy returned."]},
{title:"The Little Mermaid",author:"Hans Christian Andersen",image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&auto=format&fit=crop&q=60",summary:"A mermaid longs to explore the land.",pages:["A young mermaid wished to visit the shore.","She rescued a prince during a sudden storm.","She learned about the world above the ocean.","She made wonderful memories on land and sea."]},
{title:"The Frog Prince",author:"Brothers Grimm",image:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400&auto=format&fit=crop&q=60",summary:"A frog helps retrieve a golden ball.",pages:["A princess dropped her golden ball in a well.","A frog retrieved it in exchange for friendship.","She kept her promise to the helpful frog.","The frog transformed into a prince."]},
{title:"Puss in Boots",author:"Charles Perrault",image:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&auto=format&fit=crop&q=60",summary:"A clever cat in boots outsmarts an ogre.",pages:["A clever cat asked for a pair of boots.","He used his wits to help his master.","He outsmarted a rich ogre in his castle.","His master lived happily ever after."]},
{title:"Aladdin and the Magic Lamp",author:"Folk Tale",image:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=400&auto=format&fit=crop&q=60",summary:"A magical lamp holds a friendly genie.",pages:["Aladdin found a hidden oil lamp in a cave.","Rubbing the lamp released a powerful genie.","He made wise wishes to help his town.","He defeated a sorcerer and protected his family."]},
{title:"Beauty and the Beast",author:"Gabrielle-Suzanne",image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400&auto=format&fit=crop&q=60",summary:"A kind girl sees true inner beauty.",pages:["Belle stayed in a castle with a Beast.","She found he was gentle and kind.","Her kindness broke an ancient spell.","The Beast transformed back into a prince."]},
{title:"Rapunzel",author:"Brothers Grimm",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=60",summary:"A girl with long hair lives in a tower.",pages:["Rapunzel lived in a tall forest tower.","She lowered her long hair for visitors.","A prince heard her song and visited her.","They escaped together and found happiness."]},
{title:"The Princess and the Pea",author:"Hans Christian Andersen",image:"https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=400&auto=format&fit=crop&q=60",summary:"A tiny pea proves true royalty.",pages:["A storm brought a visitor to the castle.","The queen placed a pea under twenty mattresses.","The visitor felt the tiny pea all night.","The prince knew she was a true princess."]},
{title:"The Emperor's New Clothes",author:"Hans Christian Andersen",image:"https://images.unsplash.com/photo-1563089145-599997674d42?w=400&auto=format&fit=crop&q=60",summary:"A vain emperor learns a lesson.",pages:["Two weavers made invisible clothes for the emperor.","The emperor walked in a royal parade.","A child pointed out he had no clothes.","The emperor realized he had been tricked."]},
{title:"The Gingerbread Man",author:"American Folk Tale",image:"https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop&q=60",summary:"A cookie runs away from everyone.",pages:["A gingerbread man ran out of the oven.","He outran everyone in the village.","A sneaky fox offered to help him cross a river.","The fox tricked the gingerbread man."]},
{title:"Ali Baba and Forty Thieves",author:"Folk Tale",image:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400&auto=format&fit=crop&q=60",summary:"A woodcutter finds a secret treasure cave.",pages:["Ali Baba said 'Open Sesame' to enter a cave.","He discovered piles of gold inside.","He outsmarted thieves with clever help.","He shared his wealth with the village."]},
{title:"The Pied Piper of Hamelin",author:"German Folk Tale",image:"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=60",summary:"A piper plays a magical tune.",pages:["A piper led troublesome mice out of town.","The mayor refused to pay the agreed price.","The piper played a song through the streets.","The town learned to keep its promises."]},
{title:"Peter Pan",author:"J.M. Barrie",image:"https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&auto=format&fit=crop&q=60",summary:"A boy visits the island of Neverland.",pages:["Peter flew to Neverland with his friends.","They visited mermaids and pirate ships.","They defeated Captain Hook on his ship.","They returned home with happy memories."]},
{title:"Alice in Wonderland",author:"Lewis Carroll",image:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&auto=format&fit=crop&q=60",summary:"Alice falls down a rabbit hole.",pages:["Alice followed a White Rabbit into a hole.","She met a Cheshire Cat and Mad Hatter.","She played croquet with the Queen of Hearts.","She woke up back on the cool grass."]},
{title:"The Wizard of Oz",author:"L. Frank Baum",image:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=400&auto=format&fit=crop&q=60",summary:"Dorothy travels down the yellow brick road.",pages:["A storm carried Dorothy to Oz.","She met Scarecrow, Tin Man, and Lion.","They walked the yellow brick road together.","She clicked her heels to return home."]},
{title:"Robin Hood",author:"English Legend",image:"https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=400&auto=format&fit=crop&q=60",summary:"A heroic archer lives in Sherwood Forest.",pages:["Robin Hood lived in Sherwood Forest.","He practiced archery with his loyal crew.","He helped those in need across the land.","He won the sheriff's archery tournament."]},
{title:"The Velveteen Rabbit",author:"Margery Williams",image:"https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=400&auto=format&fit=crop&q=60",summary:"A toy rabbit becomes real through love.",pages:["A stuffed rabbit lived in a playroom.","A boy loved him above all other toys.","The fairy transformed him into a real rabbit.","He hopped happily into the wild forest."]},
{title:"The Wind in the Willows",author:"Kenneth Grahame",image:"https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=400&auto=format&fit=crop&q=60",summary:"Animals share adventures along the riverbank.",pages:["Mole and Rat went boating on the river.","Toad got into wild driving troubles.","His loyal friends helped him save his home.","They celebrated along the peaceful riverbank."]},

let page="Home",activeBook=null,bookPage=0,sentence=[],category=Object.keys(vocab)[0];
const pages=["Home","Books","Draw","Color by Number","Sentence","Vocabulary","Settings"];
function go(p){page=p;render()}
function renderNav(){document.querySelector("#nav").innerHTML=pages.map(p=>`<button class="${page===p?"active":""}" data-page="${p}">${p==="Color by Number"?"Color":p}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function render(){renderNav();const root=document.querySelector("#app");if(page==="Home")root.innerHTML=home();if(page==="Books")root.innerHTML=library();if(page==="Draw")root.innerHTML=drawing();if(page==="Color by Number")root.innerHTML=coloring();if(page==="Sentence")root.innerHTML=sentenceBoard();if(page==="Vocabulary")root.innerHTML=vocabularyPage();if(page==="Settings")root.innerHTML=settings();bind()}
function home(){return `<section class="hero"><div class="squiggles" id="squiggles"><svg viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"><path stroke="#ee78ad" d="M-20 80 C180 10 180 180 360 100 S600 10 800 100 950 120 1030 50"/><path stroke="#609de0" d="M-20 280 C160 190 250 360 420 250 S650 170 780 290 920 330 1030 230"/><path stroke="#e9bd42" d="M100 410 C160 250 320 300 400 190 S650 100 700 210 850 260 900 130"/></svg></div><div class="hero-content"><p class="muted">A welcoming space for every way of communicating</p><h1>Read, make, and share—your way.</h1><p>Explore stories, create art, and build messages at your own pace.</p><button class="btn primary" data-go="Sentence">Make a sentence</button> <button class="btn" data-go="Books">Explore books</button><p class="small">Tap the heading to hide the moving lines.</p></div></section><div class="grid">${[["📚","Read a Book","Browse sample stories and search book listings.","Books"],["✏️","Draw","Make a picture with colors and tools.","Draw"],["▦","Color by Number","Fill picture regions with color.","Color by Number"],["💬","Make a Sentence","Choose words to build a message.","Sentence"],["⚙️","My Vocabulary","Personalize words and categories.","Vocabulary"]].map(x=>`<button class="card home-card" data-go="${x[3]}" style="text-align:left;color:inherit"><span class="icon">${x[0]}</span><span><h2>${x[1]}</h2><p>${x[2]}</p></span></button>`).join("")}</div>`}
function library(){if(activeBook!==null)return reader();return `<div class="section-head"><div><p class="muted">Original sample stories</p><h1>Book shelf</h1></div><input class="input" id="bookSearch" placeholder="Search sample stories…" aria-label="Search sample stories"></div><div class="grid" id="bookGrid">${books.map((b,i)=>`<article class="card book-card"><img src="${b.image}" alt="${escapeHtml(b.title)} cover" class="book-cover-img" loading="lazy"><div><h2>${escapeHtml(b.title)}</h2><p class="muted small" style="margin-bottom:12px">${escapeHtml(b.summary)}</p></div><button class="btn primary" data-read="${i}">Read</button></article>`).join("")}</div><section class="section-head"><div><p class="muted">Search up to 500 public book listings</p><h2>500+ Children's Books Catalog</h2></div></section><form id="catalogSearch" class="row"><input class="input" name="q" placeholder="Type a subject or topic (e.g. animals, adventure, magic)..." value="children" required><button class="btn primary">Search 500 Books</button></form><p class="small muted" id="catalogStatus">Click 'Search 500 Books' to load up to 500 public titles from Open Library.</p><div class="grid" id="catalogGrid"></div>`}
function reader(){let b=books[activeBook];return `<button class="btn" id="backToShelf">← Back to shelf</button><article class="reader"><p class="muted">${b.title}</p><div class="page-text">${b.pages[bookPage]}</div><p class="muted">Page ${bookPage+1} of ${b.pages.length}</p><div class="reader-controls"><button class="btn" id="prevPage" ${bookPage===0?"disabled":""}>Previous</button><button class="btn" id="readAloud">Read aloud</button><button class="btn primary" id="nextPage" ${bookPage===b.pages.length-1?"disabled":""}>Next</button></div></article>`}
function drawing(){return `<div class="section-head"><div><p class="muted">A creative space</p><h1>Drawing studio</h1></div></div><div class="toolbar"><label>Brush <select id="brush"><option>Pen</option><option>Marker</option><option>Pencil</option><option>Soft brush</option><option>Eraser</option></select></label><label>Size <input id="size" type="range" min="2" max="36" value="7"></label><label>Shape <select id="shape"><option value="free">Free draw</option><option value="line">Ruler line</option><option value="circle">Circle stencil</option><option value="square">Square stencil</option><option value="triangle">Triangle stencil</option></select></label><button class="btn" id="undo">Undo</button><button class="btn" id="clearCanvas">Clear</button><button class="btn primary" id="saveDrawing">Save drawing</button></div><div class="toolbar"><span>Color</span><div class="colors" id="palette"></div></div><div class="canvas-wrap"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><h2>Saved drawings</h2><div class="grid">${drawings.map((d,i)=>`<div class="card"><img alt="Saved drawing ${i+1}" src="${d}" style="width:100%;border-radius:10px"><button class="btn" data-delete-drawing="${i}">Remove</button></div>`).join("")||`<p class="muted">Your saved drawings will appear here.</p>`}</div>`}
function sentenceBoard(){const cats=Object.keys(vocab);if(!vocab[category])category=cats[0];return `<div class="section-head"><div><p class="muted">Choose words to share a message</p><h1>Sentence board</h1></div></div><section class="card"><div class="muted small">Tap a word below to add it. Tap a sentence word to remove it.</div><div class="sentence" id="sentence">${sentence.map((w,i)=>`<button class="btn" data-remove-word="${i}">${escapeHtml(w)} ×</button>`).join(" ")||`<span class="muted">Your words will appear here.</span>`}</div><div class="row"><button class="btn" id="clearSentence">Clear sentence</button><button class="btn primary" id="speak">Speak</button><button class="btn" id="saveSentence">Save sentence</button></div></section><div class="board-layout" style="margin-top:16px"><aside class="categories">${cats.map(c=>`<button class="btn ${category===c?"primary":""}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</aside><section class="card"><div class="word-grid">${(vocab[category]||[]).map(w=>`<button class="word" data-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")||`<p class="empty">No words in this category yet.</p>`}</div></section></div>`}
function vocabularyPage(){return `<div class="section-head"><div><p class="muted">Personalize your words</p><h1>My vocabulary</h1></div></div><p class="notice">Add your own words and categories. Changes appear on the sentence board and stay in this browser.</p><section class="card"><h2>Add a word</h2><form id="addWord" class="row"><input class="input" name="word" required placeholder="Word or short phrase"><select name="category">${Object.keys(vocab).map(c=>`<option>${escapeHtml(c)}</option>`).join("")}</select><input class="input" name="newCategory" placeholder="Or create a category"><button class="btn primary">Add word</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Add a category</h2><form id="addCategory" class="row"><input class="input" name="category" required placeholder="Category name"><button class="btn">Add category</button></form></section><div class="section-head"><h2>Words</h2><input id="vocabSearch" class="input" placeholder="Find a word…"></div><div id="vocabList" class="list">${vocabList()}</div>`}
function vocabList(q=""){return Object.entries(vocab).flatMap(([c,words])=>words.map((w,i)=>({c,w,i}))).filter(x=>(x.w+" "+x.c).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="list-item"><span><b>${escapeHtml(x.w)}</b> <span class="muted small">· ${escapeHtml(x.c)}</span></span><span class="row"><button class="btn small" data-edit-word="${encodeURIComponent(x.c)}|${x.i}">Edit</button><button class="btn small" data-delete-word="${encodeURIComponent(x.c)}|${x.i}">Remove</button></span></div>`).join("")||`<p class="empty">No matching words.</p>`}
function settings(){return `<div class="section-head"><div><p class="muted">Your browser, your choices</p><h1>Settings</h1></div></div><section class="card"><h2>Local data</h2><p>Vocabulary, drawings, saved sentences, and history are stored in this browser on this device.</p><button class="btn" id="exportData">Download my data</button> <button class="btn" id="resetData">Reset app data</button></section><section class="card" style="margin-top:14px"><h2>About</h2><p class="muted">Sample stories are original. Book search uses the Open Library public catalog. Coloring pages are prototype examples.</p><label><input type="checkbox" id="reduceMotion"> Hide home-page motion</label></section>`}
function coloring(){let items=[["Easy","Friendly fish",["#f2a65a","#4b9b9b","#8ac27d"],["<path data-color='1' d='M38 90 Q80 35 130 90 Q80 145 38 90Z' fill='white'/><path data-color='2' d='M130 90 L170 55 L170 125Z' fill='white'/><circle data-color='3' cx='72' cy='82' r='6' fill='white'/>"]],["Easy","Sunny flower",["#f0c84b","#e78670","#6e9b6b"],["<circle data-color='1' cx='100' cy='85' r='24' fill='white'/><path data-color='2' d='M100 45 Q78 34 84 60 Q62 58 76 78 Q55 92 82 99 Q71 122 96 111 Q101 137 111 111 Q137 121 122 98 Q148 91 124 77 Q139 56 115 59 Q118 35 100 45Z' fill='white'/><path data-color='3' d='M96 108 L104 108 L108 160 L92 160Z' fill='white'/>"]],["Medium","Little sailboat",["#6fa8c3","#e7a65c","#e3d58b","#659a73"],["<path data-color='1' d='M25 125 Q100 110 175 125 L160 145 L45 145Z' fill='white'/><path data-color='2' d='M96 45 L96 118 L48 118Z' fill='white'/><path data-color='3' d='M104 58 L104 118 L150 118Z' fill='white'/><path data-color='4' d='M15 150 Q45 140 75 150 T135 150 T195 150 L195 175 L15 175Z' fill='white'/>"]],["Advanced","Cozy house",["#d77d62","#e8c77b","#6b9b73","#8fb5c4","#8a6f5a"],["<path data-color='1' d='M35 90 L100 35 L165 90Z' fill='white'/><path data-color='2' d='M48 88 L152 88 L152 155 L48 155Z' fill='white'/><rect data-color='3' x='86' y='112' width='28' height='43' fill='white'/><rect data-color='4' x='58' y='100' width='20' height='20' fill='white'/><rect data-color='5' x='122' y='100' width='20' height='20' fill='white'/>"]]];
return `<div class="section-head"><div><p class="muted">Tap a number, then a matching picture region</p><h1>Color by number</h1></div><select id="difficulty"><option>All levels</option><option>Easy</option><option>Medium</option><option>Advanced</option></select></div><p class="notice small">Prototype coloring examples. Tap a color number, then tap a matching region.</p><div class="coloring-grid">${items.map((it,i)=>`<article class="color-page" data-level="${it[0]}"><h2>${it[1]}</h2><p class="muted small">${it[0]} · Choose a number, then tap a region.</p><svg viewBox="0 0 200 190" role="img" aria-label="${it[1]} color by number picture">${it[3].join("")}</svg><div class="row">${it[2].map((col,n)=>`<button class="btn color-number" data-pic="${i}" data-num="${n+1}" style="border-color:${col}">${n+1} <span style="display:inline-block;width:16px;height:16px;background:${col};border-radius:50%;vertical-align:middle"></span></button>`).join("")}</div><p class="small muted" id="progress${i}">Choose a number to begin.</p><button class="btn small" data-reset-pic="${i}">Reset picture</button></article>`).join("")}</div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function bind(){
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
const heading=document.querySelector(".hero h1");if(heading)heading.onclick=()=>document.querySelector("#squiggles")?.classList.toggle("off");
if(page==="Books"){
if(activeBook!==null){
document.querySelector("#backToShelf").onclick=()=>{activeBook=null;bookPage=0;render()};
document.querySelector("#prevPage").onclick=()=>{bookPage--;render()};
document.querySelector("#nextPage").onclick=()=>{bookPage++;render()};
document.querySelector("#readAloud").onclick=()=>{if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(books[activeBook].pages[bookPage]))}else alert("Device speech is unavailable.")}
}
else{
document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{activeBook=+b.dataset.read;bookPage=0;render()});
document.querySelector("#bookSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll("#bookGrid .book-card").forEach((c,i)=>c.classList.toggle("hidden",!books[i].title.toLowerCase().includes(q)&&!books[i].summary.toLowerCase().includes(q)))};
document.querySelector("#catalogSearch").onsubmit=async e=>{e.preventDefault();const q=new FormData(e.target).get("q").trim(),status=document.querySelector("#catalogStatus"),grid=document.querySelector("#catalogGrid");status.textContent="Loading up to 500 books…";grid.innerHTML="";try{const response=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=500`);if(!response.ok)throw Error();const data=await response.json(),results=(data.docs||[]).slice(0,500);grid.innerHTML=results.map(book=>{const coverImg=book.cover_i?`https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`:`https://via.placeholder.com/200x260/e8f2ed/376c5c?text=${encodeURIComponent(book.title||'Book')}`;return `<article class="card book-card"><img src="${coverImg}" alt="${escapeHtml(book.title||'Book')} cover" class="book-cover-img" loading="lazy"><div><h3>${escapeHtml(book.title||"Untitled")}</h3><p class="muted small">${escapeHtml((book.author_name||["Author unknown"]).slice(0,2).join(", "))}</p><p class="muted small" style="margin-bottom:12px">First published: ${escapeHtml(String(book.first_publish_year||"N/A"))}</p></div>${book.key?`<a class="btn primary" href="https://openlibrary.org${encodeURI(book.key)}" target="_blank" rel="noopener">View Book</a>`:""}</article>`}).join("")||`<p class="empty">No results found. Try another search query.</p>`;status.textContent=`Loaded ${results.length} book titles.`}catch{status.textContent="Could not fetch book catalog. Check your internet connection."}};
}}
if(page==="Draw")setupCanvas();
if(page==="Sentence"){document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{sentence.push(b.dataset.word);render()});document.querySelectorAll("[data-remove-word]").forEach(b=>b.onclick=()=>{sentence.splice(+b.dataset.removeWord,1);render()});document.querySelector("#clearSentence").onclick=()=>{sentence=[];render()};document.querySelector("#saveSentence").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");saved.unshift(s);history.unshift(s);persist();alert("Sentence saved.");render()};document.querySelector("#speak").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(s));else alert("Device speech is unavailable.")}}
if(page==="Vocabulary"){document.querySelector("#addWord").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=f.get("word").trim(),c=(f.get("newCategory").trim()||f.get("category"));if(f.get("newCategory").trim()&&!vocab[c])vocab[c]=[];if(!vocab[c].some(x=>x.toLowerCase()===w.toLowerCase()))vocab[c].push(w);persist();render()};document.querySelector("#addCategory").onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get("category").trim();if(vocab[c])return alert("That category already exists.");vocab[c]=[];persist();render()};document.querySelector("#vocabSearch").oninput=e=>document.querySelector("#vocabList").innerHTML=vocabList(e.target.value);document.querySelectorAll("[data-delete-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.deleteWord).split("|");if(confirm(`Remove “${vocab[c][i]}”?`)){vocab[c].splice(+i,1);persist();render()}});document.querySelectorAll("[data-edit-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.editWord).split("|"),next=prompt("Edit word:",vocab[c][i]);if(next?.trim()){vocab[c][i]=next.trim();persist();render()}})}
if(page==="Settings"){document.querySelector("#exportData").onclick=()=>{let data={vocab,saved,history,drawings};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="little-ways-data.json";a.click();URL.revokeObjectURL(a.href)};document.querySelector("#resetData").onclick=()=>{if(confirm("Reset all saved data in this browser? This cannot be undone.")){Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}};document.querySelector("#reduceMotion").onchange=e=>document.querySelector("#squiggles")?.classList.toggle("off",e.target.checked)}
if(page==="Color by Number"){document.querySelector("#difficulty").onchange=e=>document.querySelectorAll(".color-page").forEach(c=>c.classList.toggle("hidden",e.target.value!=="All levels"&&c.dataset.level!==e.target.value));document.querySelectorAll(".color-number").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.dataset.selected=b.dataset.num;card.querySelectorAll(".color-number").forEach(x=>x.classList.toggle("primary",x===b))});document.querySelectorAll(".color-page svg [data-color]").forEach(el=>el.onclick=()=>{let card=el.closest(".color-page"),n=card.dataset.selected;if(!n)return alert("Choose a color number first.");if(el.dataset.color!==n)return;let button=[...card.querySelectorAll(".color-number")].find(x=>x.dataset.num===n);el.setAttribute("fill",button.querySelector("span").style.backgroundColor);let regions=[...card.querySelectorAll("svg [data-color]")],filled=regions.filter(x=>x.getAttribute("fill")!=="white").length;card.querySelector("p[id^=progress]").textContent=`${filled} of ${regions.length} regions colored.`});document.querySelectorAll("[data-reset-pic]").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.querySelectorAll("svg [data-color]").forEach(x=>x.setAttribute("fill","white"));delete card.dataset.selected;card.querySelector("p[id^=progress]").textContent="Choose a number to begin."})}
}
function setupCanvas(){const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");let color="#24333b",drawing=false,start=null,undo=[];function resize(){let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,old=document.createElement("canvas");old.width=canvas.width;old.height=canvas.height;if(old.width)old.getContext("2d").drawImage(canvas,0,0);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}resize();window.addEventListener("resize",resize);let colors=["#24333b","#d85f50","#e88c58","#e7c34d","#75a66b","#438b78","#4f8ca8","#6b75a7","#9a6fa2","#d8759b","#8b5e48","#7b8584","#f1b8a8","#b9d9ca","#c8d6ed","#f1e1a0","#b5a175","#343434","#ffffff","#d7a2e8","#8dcbd1","#b1c86a"];document.querySelector("#palette").innerHTML=colors.map((c,i)=>`<button class="color ${i===0?"selected":""}" title="${c}" aria-label="Select color ${c}" style="background:${c}" data-color="${c}"></button>`).join("");document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b))});function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function down(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;start=pos(e);undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.strokeStyle=document.querySelector("#brush").value==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value;ctx.lineCap="round";ctx.globalAlpha=1;ctx.lineTo(start.x+.1,start.y+.1);ctx.stroke()}function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.strokeStyle=document.querySelector("#brush").value==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value*(document.querySelector("#brush").value==="Marker"?2:1);ctx.lineCap="round";ctx.globalAlpha=document.querySelector("#brush").value==="Pencil"?.48:document.querySelector("#brush").value==="Soft brush"?.25:document.querySelector("#brush").value==="Marker"?.55:1;ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke();start=p}function up(){drawing=false;ctx.globalAlpha=1}canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("Remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()})}
render();
</script>
</body>
</html>
