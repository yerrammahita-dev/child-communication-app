function getBookStory(title, pageCount) {
  if (customBookStories[title]) {
    const arr = customBookStories[title];
    const pages = [];
    for(let i=0; i<pageCount; i++){
      pages.push({ text: arr[i % arr.length] + ` (Part ${i+1} of ${pageCount})` });
    }
    return pages;
  }
  const pages = [];
  for(let p=1; p<=pageCount; p++){
    pages.push({
      text: `Page ${p} of ${pageCount} in "${title}": In this wonderful chapter, new challenges and joyful discoveries unfolded. Our characters learned valuable lessons about friendship, courage, and perseverance as they navigated their unique journey together.`
    });
  }
  return pages;
}

const mathCategories = mathGradeSubjects.map((subject, sIdx) => {
  if(subject === "Kindergarten"){
    return { id: `math-sub-${sIdx}`, name: "Kindergarten Mathematics", category: subject, parts: kindergartenParts };
  }
  const topics = gradeCustomTopics[subject] || topicNames;
  const parts = [];
  for(let p = 1; p <= 10; p++){
    const questions = [];
    const topic = topics[p - 1] || `Topic ${p}`;
    for(let q = 1; q <= 10; q++){
      let val = (sIdx + 1) * p + q;
      let qText = `${subject} — ${topic} (Q${q}): Solve or evaluate expression for value ${val} + ${q * 2}`;
      let ans = `${val + q * 2}`;
      let opts = [`${val + q * 2}`, `${val + q + 5}`, `${Math.max(0, val - q)}`, `${val + 10}`];
      opts.sort(() => Math.random() - 0.5);
      questions.push({ q: qText, options: opts, answer: ans });
    }
    parts.push({ partNum: p, topic, questions });
  }
  return { id: `math-sub-${sIdx}`, name: `${subject} Mathematics`, category: subject, parts };
});

function openStencilModal(stencilText, customBgImg = null){
  const modal = document.querySelector("#modalOverlay");
  const modalBody = document.querySelector("#modalBody");
  modalBody.innerHTML = `
    <button class="modal-close" id="closeModal">✕</button>
    <h2>Tracing Studio: ${escapeHtml(stencilText)}</h2>
    <p class="muted small" style="margin-bottom:12px">Trace over the guide on the canvas below!</p>
    <div class="canvas-wrap" style="position:relative">
      <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;user-select:none;overflow:hidden">
        ${customBgImg ? `<img src="${customBgImg}" style="width:100%;height:100%;object-fit:contain;opacity:0.25">` : `<div style="font-size:120px;font-weight:900;color:rgba(234,179,8,0.15)">${escapeHtml(stencilText)}</div>`}
      </div>
      <canvas id="stencilCanvas" aria-label="Tracing canvas"></canvas>
    </div>
    <div class="toolbar" style="margin-top:16px">
      <button class="btn" id="clearStencilCanvas"><i class="fa-solid fa-trash mr-1"></i> Clear</button>
    </div>
  `;
  modal.classList.remove("hidden");
  document.querySelector("#closeModal").onclick = () => modal.classList.add("hidden");

  const sc = document.getElementById("stencilCanvas");
  const sctx = sc.getContext("2d");
  let drawing = false, start = null;

  function resizeStencil(){
    let r = sc.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    sc.width = r.width * dpr; sc.height = r.height * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.fillStyle = "white"; sctx.fillRect(0, 0, r.width, r.height);
  }
  setTimeout(resizeStencil, 50);

  function pos(e){ let r = sc.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function down(e){ e.preventDefault(); sc.setPointerCapture(e.pointerId); drawing = true; start = pos(e); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    let p = pos(e);
    sctx.beginPath();
    sctx.strokeStyle = "#eab308";
    sctx.lineWidth = 10;
    sctx.lineCap = "round";
    sctx.moveTo(start.x, start.y);
    sctx.lineTo(p.x, p.y);
    sctx.stroke();
    start = p;
  }
  function up(e){ drawing = false; try{ sc.releasePointerCapture(e.pointerId); }catch(err){} }

  sc.addEventListener("pointerdown", down);
  sc.addEventListener("pointermove", move);
  sc.addEventListener("pointerup", up);

  document.getElementById("clearStencilCanvas").onclick = () => {
    sctx.fillStyle = "white";
    sctx.fillRect(0, 0, sc.width, sc.height);
  };
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  
  if(page==="Books"){
    if(activeBook!==null){
      document.querySelector("#backToShelf").onclick=()=>{activeBook=null;bookPage=0;render()};
      document.querySelector("#prevPage").onclick=()=>{if(bookPage>0){bookPage--;render()}};
      document.querySelector("#nextPage").onclick=()=>{if(bookPage<books[activeBook].pages.length-1){bookPage++;render()}};
      document.querySelector("#readAloud").onclick=()=>{
        if("speechSynthesis"in window){
          speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(books[activeBook].pages[bookPage].text));
        }else alert("Device speech is unavailable.");
      };
    } else {
      document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{activeBook=+b.dataset.read;bookPage=0;render()});
      document.querySelectorAll("[data-star]").forEach(b=>b.onclick=(e)=>{
        e.stopPropagation();
        const title = decodeURIComponent(b.dataset.star);
        userFavs.stars[title] = !userFavs.stars[title];
        persist(); render();
      });
      document.querySelectorAll("[data-heart]").forEach(b=>b.onclick=(e)=>{
        e.stopPropagation();
        const title = decodeURIComponent(b.dataset.heart);
        userFavs.hearts[title] = !userFavs.hearts[title];
        persist(); render();
      });
      document.querySelector("#bookSearch").oninput=e=>{
        let q=e.target.value.toLowerCase();
        document.querySelectorAll("#bookGrid .book-card").forEach((c,i)=>c.classList.toggle("hidden",!books[i].title.toLowerCase().includes(q)&&!books[i].summary.toLowerCase().includes(q)));
      };
    }
  }

  if(page==="Math"){
    document.querySelectorAll("[data-open-math-subject]").forEach(b => {
      b.onclick = () => {
        activeMathCat = b.dataset.openMathSubject;
        activeMathPart = null;
        render();
      };
    });

    document.querySelectorAll("[data-select-part]").forEach(b => {
      b.onclick = () => {
        activeMathPart = +b.dataset.selectPart;
        activeMathQIdx = 0;
        render();
      };
    });

    const backSubj = document.querySelector("#backToMathSubjects");
    if(backSubj) backSubj.onclick = () => { activeMathCat = null; render(); };

    const backParts = document.querySelector("#backToParts");
    if(backParts) backParts.onclick = () => { activeMathPart = null; render(); };

    document.querySelectorAll(".math-opt-btn").forEach(btn => btn.onclick = () => {
      const cat = mathCategories.find(c => c.id === activeMathCat);
      const partObj = cat.parts.find(p => p.partNum === activeMathPart);
      const qObj = partObj.questions[activeMathQIdx];
      const fb = document.querySelector("#mathFeedback");
      const chosen = btn.dataset.opt;

      if(chosen === qObj.answer){
        fb.style.color = "#2e7d32";
        fb.textContent = "Correct!";
        const modal = document.querySelector("#modalOverlay");
        const modalBody = document.querySelector("#modalBody");
        
        if(activeMathQIdx < 9){
          activeMathQIdx++;
          setTimeout(()=>{ render(); }, 800);
        } else {
          modalBody.innerHTML = `
            <h2>Oh my god, you did so great! 🎉</h2>
            <p class="muted" style="margin:12px 0">You finished Part ${activeMathPart} (${partObj.topic}) of ${cat.category}!</p>
            <button class="btn primary" id="nextPartBtn">${activeMathPart < 10 ? `Start Part ${activeMathPart + 1}` : 'Return to Subjects'}</button>

          document.querySelector("#nextPartBtn").onclick = () => {
            modal.classList.add("hidden");
            if(activeMathPart < 10){
              activeMathPart++;
              activeMathQIdx = 0;
            } else {
              activeMathCat = null;
              activeMathPart = null;
            }
            render();
          };
        }
      } else {
        fb.style.color = "#c62828";
        fb.textContent = "Not quite! Try again.";
      }

  if(page==="Draw") setupCanvas();

  if(page==="Tracing"){

      uploadInput.onchange = (e) => {
        const file = e.target.files[0];

    document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{sentence.push(b.dataset.word);render()});

    document.querySelector("#speak").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(s));else alert("Device speech is unavailable.");};
  }

  if(page==="Vocabulary"){
    document.querySelector("#addWord").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=f.get("word").trim(),c=(f.get("newCategory").trim()||f.get("category"));if(f.get("newCategory").trim()&&!vocab[c])vocab[c]=[];if(!vocab[c].some(x=>x.toLowerCase()===w.toLowerCase()))vocab[c].push(w);persist();render()};
    document.querySelector("#addCategory").onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get("category").trim();if(vocab[c])return alert("That category already exists.");vocab[c]=[];persist();render()};
    document.querySelector("#vocabSearch").oninput=e=>document.querySelector("#vocabList").innerHTML=vocabList(e.target.value);
    
    document.querySelectorAll("[data-delete-word]").forEach(b=>b.onclick=()=>{
      let[c,i]=decodeURIComponent(b.dataset.deleteWord).split("|");
      vocab[c].splice(+i,1);
      persist();
      render();
    });

    document.querySelectorAll("[data-edit-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.editWord).split("|"),next=prompt("Edit word:",vocab[c][i]);if(next?.trim()){vocab[c][i]=next.trim();persist();render()}});
  }

  if(page==="Settings"){
    document.querySelector("#exportData").onclick=()=>{let data={vocab,saved,history,drawings,customStencils,savedColors};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="little-minds-data.json";a.click();URL.revokeObjectURL(a.href)};
    document.querySelector("#resetData").onclick=()=>{if(confirm("Reset all saved data in this browser? This cannot be undone.")){Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}};
  }
}

function setupCanvas(){
  const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");
  let drawing=false,start=null,undo=[];
  
  function resize(){
    let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,old=document.createElement("canvas");
    old.width=canvas.width;old.height=canvas.height;
    if(old.width)old.getContext("2d").drawImage(canvas,0,0);
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);
    if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  }
  resize();window.addEventListener("resize",resize);

  document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{
    activeColor=b.dataset.color;
    document.querySelector("#nativeColorPicker").value = activeColor;
    document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b));
  });

  document.querySelector("#nativeColorPicker").oninput=(e)=>{ activeColor = e.target.value; };

  document.querySelector("#saveCurrentColorBtn").onclick = () => {
    if(!savedColors.includes(activeColor)){
      savedColors.push(activeColor);
      persist();
      const countEl = document.querySelector("#savedCount");
      if(countEl) countEl.textContent = savedColors.length;
      alert(`Color ${activeColor} saved to Saved Colors!`);
    } else {
      alert("This color is already in your Saved Colors.");
    }
  };

  document.querySelector("#moreColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Expanded Color Palette (72 Vibrant Colors)</h2>
      <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
        ${vibrantPalette72.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-col="${c}"></button>`).join("")}
      </div>
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-col]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickCol;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#savedColorsBtn").onclick=()=>{
    const modal = document.querySelector("#modalOverlay");
    const body = document.querySelector("#modalBody");
    body.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Saved Colors</h2>
      ${savedColors.length === 0 ? '<p class="empty">No saved colors yet. Click "Save Color" in the studio.</p>' : `
        <div class="colors" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px;margin-top:20px">
          ${savedColors.map(c=>`<button class="color" style="background:${c};width:36px;height:36px" data-pick-saved="${c}"></button>`).join("")}
        </div>
      `}
    `;
    modal.classList.remove("hidden");
    body.querySelectorAll("[data-pick-saved]").forEach(b=>b.onclick=()=>{
      activeColor = b.dataset.pickSaved;
      document.querySelector("#nativeColorPicker").value = activeColor;
      modal.classList.add("hidden");
      render();
    });
    document.querySelector("#closeModal").onclick=()=>modal.classList.add("hidden");
  };

  document.querySelector("#brush").onchange=(e)=>{ activeBrush = e.target.value; };

  function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function down(e){
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drawing=true;
    start=pos(e);
    undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));

    if(activeBrush === "Stamp"){
      drawStamp(start.x, start.y);
    }
  }
  
  function drawStamp(x, y) {
    ctx.save();
    ctx.fillStyle = activeColor;
    ctx.font = "28px sans-serif";
    const symbols = ["⭐", "❤️", "🌸", "☀️", "🍀", "🎨"];
    const sym = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(sym, x - 12, y + 10);
    ctx.restore();
  }

  function move(e){
    if(!drawing)return;
    e.preventDefault();
    let p=pos(e);
    const brush = activeBrush;
    const sz = +document.querySelector("#size").value;

    if (brush === "Stamp") {
      if(Math.hypot(p.x - start.x, p.y - start.y) > 25) {
        drawStamp(p.x, p.y);
        start = p;
      }
      return;
    }

    if (brush === "Wispy Paintbrush") {
      for (let i = -sz/2; i <= sz/2; i += 3) {
        ctx.beginPath();
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.35;
        ctx.moveTo(start.x + i, start.y + (Math.random()*4-2));
        ctx.lineTo(p.x + i, p.y + (Math.random()*4-2));
        ctx.stroke();
      }
    } else if (brush === "Watercolor") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 2.5;
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.22;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Crayon") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.4;
      ctx.lineCap = "butt";
      ctx.globalAlpha = 0.65;
      for(let d=0; d<5; d++) {
        let ox = (Math.random()-0.5)*sz*0.8;
        let oy = (Math.random()-0.5)*sz*0.8;
        ctx.moveTo(start.x+ox, start.y+oy);
        ctx.lineTo(p.x+ox, p.y+oy);
      }
      ctx.stroke();
    } else if (brush === "Pencil") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = Math.max(1, sz * 0.35);
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.85;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.fillStyle = activeColor;
      for(let k=0; k<3; k++){
        let dx = p.x + (Math.random()-0.5)*sz*1.5;
        let dy = p.y + (Math.random()-0.5)*sz*1.5;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(dx, dy, 1.2, 1.2);
      }
    } else if (brush === "Marker") {
      ctx.beginPath();
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "square";
      ctx.globalAlpha = 0.95;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "Eraser") {
      ctx.beginPath();
      ctx.strokeStyle = "white";
      ctx.lineWidth = sz * 1.8;
      ctx.lineCap = "round";
      ctx.globalAlpha = 1.0;
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    start=p;
  }
  
  function up(e){
    if(drawing) {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    }
    drawing=false;
    ctx.globalAlpha=1;
  }
  
  canvas.addEventListener("pointerdown",down);
  canvas.addEventListener("pointermove",move);
  canvas.addEventListener("pointerup",up);
  canvas.addEventListener("pointercancel",up);

  document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};
  document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};
  document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("Remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};
  document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()});
}

(function initWordBg(){
  const canvas = document.getElementById("bgCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width, height;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const backgroundWords = [
    "Read", "Create", "Communicate", "Joy", "Story", "Paint", "Spark", "Voice", "Dream", "Imagine",
    "Friend", "Listen", "Play", "Smile", "Happy", "Together", "Colors", "Books", "Words", "Feelings",
    "Kindness", "Hope", "Explore", "Write", "Draw", "Share", "Peace", "Quiet", "Magic", "Journey",
    "Love", "Help", "Want", "Need", "Calm", "Brave", "Brilliant", "Shine", "Grow", "Connect", "Learn", "Mind"
  ];

  const vibrantColors = [
    [234, 179, 8], [255, 145, 0], [255, 234, 0], [0, 230, 118], [0, 176, 255], [224, 64, 251]
  ];

  const wordParticles = [];
  for (let i = 0; i < 45; i++) {
    const col = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];
    wordParticles.push({
      text: backgroundWords[Math.floor(Math.random() * backgroundWords.length)],
      x: Math.random() * width,
      y: Math.random() * height,
      fontSize: 14 + Math.floor(Math.random() * 14),
      color: col,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      alpha: 0.3 + Math.random() * 0.4
    });
  }

  function animate(){
    ctx.clearRect(0, 0, width, height);
    wordParticles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -100) p.x = width + 100;
      if (p.x > width + 100) p.x = -100;
      if (p.y < -60) p.y = height + 60;
      if (p.y > height + 60) p.y = -60;

      ctx.font = `600 ${p.fontSize}px 'Fredoka', system-ui, sans-serif`;
      ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha})`;
      ctx.fillText(p.text, p.x, p.y);
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

render();
</script>
